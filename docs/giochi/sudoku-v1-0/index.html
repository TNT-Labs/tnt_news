<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SUDOKU — Neon Logic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #050310;
    --fg: #efecfb;
    --muted: rgba(255,255,255,0.45);
    --accent: #00f5ff;
    --accent2: #b026ff;
    --err: #ff2a5e;
    --gold: #ffbe0b;
    --panel: rgba(12, 8, 28, 0.55);
    --border: rgba(255,255,255,0.08);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0,245,255,0.07), transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(176,38,255,0.06), transparent 60%),
      linear-gradient(180deg, #050310 0%, #0a0618 50%, #080514 100%);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 4px);
    pointer-events: none;
    z-index: 200;
    opacity: 0.22;
    mix-blend-mode: multiply;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    gap: 8px;
    max-width: 560px;
    margin: 0 auto;
  }

  header { text-align: center; line-height: 1; }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(18px, 4.5vw, 30px);
    letter-spacing: 10px;
    padding-left: 10px;
    background: linear-gradient(180deg, #ffffff 0%, #00f5ff 45%, #b026ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(0,245,255,0.5));
    animation: titleGlow 4s ease-in-out infinite;
  }

  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(0,245,255,0.5)); }
    50% { filter: drop-shadow(0 0 26px rgba(176,38,255,0.6)); }
  }

  .subtitle { font-size: 9px; letter-spacing: 6px; color: rgba(255,255,255,0.35); font-weight: 700; margin-top: 4px; }

  .hud {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .hud .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 54px; }
  .hud .label { font-size: 8px; letter-spacing: 2px; color: var(--muted); font-weight: 700; }
  .hud .value { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(0,245,255,0.4); }
  .hud .value.err { color: var(--err); text-shadow: 0 0 10px rgba(255,42,94,0.5); }

  .stage { position: relative; }

  .board {
    display: grid;
    grid-template-columns: repeat(9, var(--cell));
    grid-template-rows: repeat(9, var(--cell));
    --cell: min(9.6vw, 5.4vh, 46px);
    background: rgba(3, 2, 10, 0.85);
    border: 2px solid rgba(0,245,255,0.35);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,245,255,0.10), inset 0 0 40px rgba(0,0,0,0.6);
  }

  .sq {
    width: var(--cell);
    height: var(--cell);
    border-right: 1px solid rgba(255,255,255,0.07);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: calc(var(--cell) * 0.5);
    color: var(--accent);
    cursor: pointer;
    position: relative;
    transition: background 0.1s;
  }
  .sq:nth-child(9n) { border-right: none; }
  .sq.bR { border-right: 2px solid rgba(0,245,255,0.35); }
  .sq.bB { border-bottom: 2px solid rgba(0,245,255,0.35); }

  .sq.given { color: #fff; }
  .sq.hl { background: rgba(0,245,255,0.06); }
  .sq.same { background: rgba(176,38,255,0.18); }
  .sq.sel { background: rgba(0,245,255,0.22); box-shadow: inset 0 0 0 2px var(--accent); }
  .sq.conflict { color: var(--err); text-shadow: 0 0 10px rgba(255,42,94,0.7); }
  .sq.conflict.given { color: var(--err); }
  .sq.wrongflash { animation: wrongFlash 0.5s; }
  @keyframes wrongFlash {
    0%, 100% { background: transparent; }
    40% { background: rgba(255,42,94,0.35); }
  }
  .sq.winwave { animation: winWave 0.5s ease-out; }
  @keyframes winWave {
    0% { background: rgba(6,255,165,0.4); }
    100% { background: transparent; }
  }

  .notes {
    position: absolute;
    inset: 1px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    pointer-events: none;
  }
  .notes span {
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(var(--cell) * 0.22);
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pad {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 100%;
    max-width: 420px;
    align-items: center;
  }
  .pad-row { display: flex; gap: 4px; justify-content: center; width: 100%; }

  .pad-btn {
    flex: 1 1 0;
    max-width: 44px;
    height: 44px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .pad-btn:hover { background: rgba(0,245,255,0.14); border-color: rgba(0,245,255,0.5); }
  .pad-btn.done { opacity: 0.25; }
  .pad-btn .count {
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 7px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .tool-btn {
    flex: 1.3 1 0;
    max-width: 74px;
    height: 44px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 8.5px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .tool-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  .tool-btn.active {
    background: rgba(176,38,255,0.2);
    border-color: var(--accent2);
    color: #fff;
    box-shadow: 0 0 12px rgba(176,38,255,0.3);
  }
  .tool-btn:disabled { opacity: 0.3; cursor: default; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 3, 16, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
  }
  .overlay.show { opacity: 1; pointer-events: all; }

  .overlay-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px;
    max-width: 94%;
    max-height: 94%;
    overflow-y: auto;
    text-align: center;
    background: rgba(12, 8, 28, 0.7);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .overlay-content h2 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 5px;
    background: linear-gradient(180deg, #fff, #00f5ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .mode-grid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 440px; }

  .mode-card {
    background: rgba(18, 12, 38, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 8px;
    width: 96px;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    text-align: center;
    transition: all 0.25s;
  }
  .mode-card:hover {
    border-color: rgba(0,245,255,0.5);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,245,255,0.18);
  }
  .mode-icon { font-size: 20px; margin-bottom: 4px; filter: drop-shadow(0 0 8px rgba(0,245,255,0.6)); }
  .mode-name { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; margin-bottom: 4px; color: var(--accent); }
  .mode-desc { font-size: 8.5px; color: rgba(255,255,255,0.5); line-height: 1.5; }

  .primary-btn, .ghost-btn {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 11px 30px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .primary-btn {
    background: linear-gradient(135deg, #00f5ff, #b026ff);
    color: #060312;
    border: none;
    box-shadow: 0 4px 22px rgba(0,245,255,0.4);
  }
  .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,245,255,0.6); }
  .ghost-btn { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.15); }
  .ghost-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  .result-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #06ffa5;
    text-shadow: 0 0 22px rgba(6,255,165,0.7);
  }
  .result-time {
    font-family: 'Orbitron', sans-serif;
    font-size: 30px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 18px rgba(0,245,255,0.6);
  }
  .new-record {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--gold);
    animation: recordPulse 1.2s ease-in-out infinite;
  }
  @keyframes recordPulse {
    0%, 100% { text-shadow: 0 0 10px rgba(255,190,11,0.6); }
    50% { text-shadow: 0 0 24px rgba(255,190,11,1); }
  }

  .series-line { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.5); font-weight: 700; line-height: 1.7; }

  .scores-panel {
    width: 300px;
    max-width: 84vw;
    background: rgba(18, 12, 38, 0.5);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: left;
  }
  .scores-title { font-size: 9px; letter-spacing: 3px; color: var(--muted); font-weight: 700; text-align: center; margin-bottom: 6px; }
  .score-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: baseline;
    font-size: 9px;
    padding: 4px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .score-row:last-child { border-bottom: none; }
  .score-row .s-mode { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 8.5px; letter-spacing: 1px; color: var(--accent2); }
  .score-row .s-meta { color: rgba(255,255,255,0.4); text-align: right; }
  .score-row .s-score { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 11px; color: #fff; min-width: 52px; text-align: right; }
  .score-row.record .s-score { color: var(--gold); text-shadow: 0 0 10px rgba(255,190,11,0.7); }
  .scores-empty { text-align: center; font-size: 9px; color: rgba(255,255,255,0.35); padding: 8px 0; }
  .scores-panel .ghost-btn { display: block; width: 100%; margin-top: 8px; padding: 5px 10px; font-size: 8px; }

  .icon-btns { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 90; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(12,8,28,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: #fff; border-color: var(--accent); box-shadow: 0 0 10px rgba(0,245,255,0.3); }

  @media (max-height: 680px) {
    header { display: none; }
    .app { gap: 5px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="title">SUDOKU</h1>
    <div class="subtitle">NEON LOGIC</div>
  </header>

  <div class="hud">
    <div class="stat"><div class="label">LIVELLO</div><div class="value" id="hudLevel" style="font-size:11px">—</div></div>
    <div class="stat"><div class="label">TEMPO</div><div class="value" id="hudTime">0:00</div></div>
    <div class="stat"><div class="label">ERRORI</div><div class="value err" id="hudErrors">0</div></div>
    <div class="stat"><div class="label">RECORD</div><div class="value" id="hudBest">—</div></div>
  </div>

  <div class="stage">
    <div class="board" id="board"></div>
  </div>

  <div class="pad">
    <div class="pad-row" id="numRow"></div>
    <div class="pad-row">
      <button class="tool-btn" id="notesBtn">✏️<br>NOTE (N)</button>
      <button class="tool-btn" id="eraseBtn">⌫<br>CANCELLA</button>
      <button class="tool-btn" id="hintBtn">💡<br>AIUTO (3)</button>
      <button class="tool-btn" id="pauseBtn">▮▮<br>PAUSA</button>
    </div>
  </div>

  <div class="icon-btns">
    <button class="icon-btn" id="soundBtn" aria-label="Audio">♪</button>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>

  <div class="overlay" id="overlay"></div>
</div>

<script>
'use strict';

// ============================================================
// COSTANTI
// ============================================================
const SCORES_KEY = 'sudoku-neon-scores';
const LEVELS = {
  easy:   { name: 'FACILE',   clues: 40 },
  medium: { name: 'MEDIO',    clues: 32 },
  hard:   { name: 'DIFFICILE', clues: 27 },
  expert: { name: 'ESPERTO',  clues: 24 }
};
const MAX_HINTS = 3;

// ============================================================
// STATO
// ============================================================
const state = {
  screen: 'menu',          // menu | playing | paused | over
  level: 'medium',
  solution: null,          // array 81
  puzzle: null,            // array 81 (0 = vuoto), le celle date
  values: null,            // array 81 valori attuali
  notes: null,             // array 81 di Set
  sel: -1,
  notesMode: false,
  errors: 0,
  hints: MAX_HINTS,
  seconds: 0,
  timerId: null
};

let soundOn = localStorage.getItem('sudoku-neon-sound') !== 'false';

// ============================================================
// PUNTEGGI (tempi migliori)
// ============================================================
function loadScores() {
  try { const s = JSON.parse(localStorage.getItem(SCORES_KEY)); return Array.isArray(s) ? s : []; }
  catch (e) { return []; }
}
function saveScore(entry) {
  const scores = loadScores();
  scores.push(entry);
  scores.sort((a, b) => a.seconds - b.seconds);
  try { localStorage.setItem(SCORES_KEY, JSON.stringify(scores.slice(0, 30))); } catch (e) {}
}
function bestTime(level) {
  const s = loadScores().filter(x => x.level === level);
  return s.length ? s[0].seconds : null;
}

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, type, vol, delay) {
  if (!soundOn) return;
  try {
    const ctx = ac();
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  place() { beep(520, 0.06, 'triangle', 0.12); },
  note() { beep(420, 0.04, 'sine', 0.08); },
  wrong() { beep(190, 0.16, 'sawtooth', 0.12); },
  hint() { beep(880, 0.1, 'sine', 0.13); beep(1100, 0.12, 'sine', 0.13, 0.08); },
  win() { beep(523, 0.12, 'triangle', 0.2); beep(659, 0.12, 'triangle', 0.2, 0.1); beep(784, 0.12, 'triangle', 0.2, 0.2); beep(1047, 0.3, 'triangle', 0.22, 0.3); },
  ui() { beep(700, 0.05, 'square', 0.06); }
};

// ============================================================
// GENERATORE
// ============================================================
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rowOf(i) { return Math.floor(i / 9); }
function colOf(i) { return i % 9; }
function boxOf(i) { return Math.floor(rowOf(i) / 3) * 3 + Math.floor(colOf(i) / 3); }

function peersConflict(grid, i, v) {
  const r = rowOf(i), c = colOf(i);
  for (let k = 0; k < 9; k++) {
    if (grid[r * 9 + k] === v && r * 9 + k !== i) return true;
    if (grid[k * 9 + c] === v && k * 9 + c !== i) return true;
  }
  const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
  for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++) {
    const j = (br + dr) * 9 + (bc + dc);
    if (grid[j] === v && j !== i) return true;
  }
  return false;
}

function fillGrid(grid, i) {
  if (i === 81) return true;
  if (grid[i] !== 0) return fillGrid(grid, i + 1);
  for (const v of shuffled([1,2,3,4,5,6,7,8,9])) {
    if (!peersConflict(grid, i, v)) {
      grid[i] = v;
      if (fillGrid(grid, i + 1)) return true;
      grid[i] = 0;
    }
  }
  return false;
}

// Conta le soluzioni fino a "limit" (per verificare l'unicità)
function countSolutions(grid, limit) {
  // Cella vuota con meno candidati
  let best = -1, bestOpts = null;
  for (let i = 0; i < 81; i++) {
    if (grid[i] !== 0) continue;
    const opts = [];
    for (let v = 1; v <= 9; v++) if (!peersConflict(grid, i, v)) opts.push(v);
    if (opts.length === 0) return 0;
    if (best === -1 || opts.length < bestOpts.length) { best = i; bestOpts = opts; }
    if (bestOpts.length === 1) break;
  }
  if (best === -1) return 1;
  let count = 0;
  for (const v of bestOpts) {
    grid[best] = v;
    count += countSolutions(grid, limit - count);
    grid[best] = 0;
    if (count >= limit) break;
  }
  return count;
}

function generatePuzzle(clues) {
  const solution = Array(81).fill(0);
  fillGrid(solution, 0);
  const puzzle = solution.slice();
  // Rimozione a coppie simmetriche finché la soluzione resta unica
  const order = shuffled(Array.from({ length: 81 }, (_, i) => i));
  let remaining = 81;
  for (const i of order) {
    if (remaining <= clues) break;
    const j = 80 - i;
    if (puzzle[i] === 0) continue;
    const backup1 = puzzle[i], backup2 = puzzle[j];
    puzzle[i] = 0;
    let removed = 1;
    if (j !== i && puzzle[j] !== 0 && remaining - 2 >= clues) { puzzle[j] = 0; removed = 2; }
    if (countSolutions(puzzle.slice(), 2) !== 1) {
      puzzle[i] = backup1;
      if (removed === 2) puzzle[j] = backup2;
    } else {
      remaining -= removed;
    }
  }
  return { solution, puzzle };
}

// ============================================================
// DOM
// ============================================================
const boardEl = document.getElementById('board');
const overlay = document.getElementById('overlay');
const sqEls = [];

for (let i = 0; i < 81; i++) {
  const d = document.createElement('div');
  d.className = 'sq';
  const c = colOf(i), r = rowOf(i);
  if (c === 2 || c === 5) d.classList.add('bR');
  if (r === 2 || r === 5) d.classList.add('bB');
  d.addEventListener('click', () => selectCell(i));
  boardEl.appendChild(d);
  sqEls.push(d);
}

const numRow = document.getElementById('numRow');
const numBtns = [];
for (let v = 1; v <= 9; v++) {
  const b = document.createElement('button');
  b.className = 'pad-btn';
  b.innerHTML = v + '<span class="count"></span>';
  b.addEventListener('click', () => inputValue(v));
  numRow.appendChild(b);
  numBtns.push(b);
}

// ============================================================
// PARTITA
// ============================================================
function startGame(level) {
  state.level = level;
  const { solution, puzzle } = generatePuzzle(LEVELS[level].clues);
  state.solution = solution;
  state.puzzle = puzzle;
  state.values = puzzle.slice();
  state.notes = Array.from({ length: 81 }, () => new Set());
  state.sel = -1;
  state.notesMode = false;
  state.errors = 0;
  state.hints = MAX_HINTS;
  state.seconds = 0;
  state.screen = 'playing';
  clearInterval(state.timerId);
  state.timerId = setInterval(tick, 1000);
  document.getElementById('notesBtn').classList.remove('active');
  document.getElementById('hintBtn').disabled = false;
  document.getElementById('hintBtn').innerHTML = '💡<br>AIUTO (' + MAX_HINTS + ')';
  hideOverlay();
  renderBoard();
  renderHud();
}

function tick() {
  if (state.screen !== 'playing') return;
  state.seconds += 1;
  renderTime();
}

function selectCell(i) {
  if (state.screen !== 'playing') return;
  state.sel = i;
  renderBoard();
}

function inputValue(v) {
  if (state.screen !== 'playing' || state.sel < 0) return;
  const i = state.sel;
  if (state.puzzle[i] !== 0) return;

  if (state.notesMode) {
    if (state.values[i] !== 0) return;
    if (state.notes[i].has(v)) state.notes[i].delete(v);
    else state.notes[i].add(v);
    sfx.note();
    renderBoard();
    return;
  }

  if (state.values[i] === v) { state.values[i] = 0; renderBoard(); renderHud(); return; }
  state.values[i] = v;
  state.notes[i].clear();

  if (v !== state.solution[i]) {
    state.errors += 1;
    sfx.wrong();
    sqEls[i].classList.add('wrongflash');
    setTimeout(() => sqEls[i].classList.remove('wrongflash'), 500);
  } else {
    sfx.place();
    // Pulisce le note dei vicini
    const r = rowOf(i), c = colOf(i), b = boxOf(i);
    for (let j = 0; j < 81; j++) {
      if (rowOf(j) === r || colOf(j) === c || boxOf(j) === b) state.notes[j].delete(v);
    }
  }
  renderBoard();
  renderHud();
  checkWin();
}

function eraseCell() {
  if (state.screen !== 'playing' || state.sel < 0) return;
  const i = state.sel;
  if (state.puzzle[i] !== 0) return;
  state.values[i] = 0;
  state.notes[i].clear();
  renderBoard();
  renderHud();
}

function useHint() {
  if (state.screen !== 'playing' || state.hints <= 0) return;
  // Riempie la cella selezionata se vuota/errata, altrimenti una cella vuota a caso
  let i = state.sel;
  if (i < 0 || state.puzzle[i] !== 0 || state.values[i] === state.solution[i]) {
    const empties = [];
    for (let j = 0; j < 81; j++) if (state.values[j] !== state.solution[j]) empties.push(j);
    if (empties.length === 0) return;
    i = empties[Math.floor(Math.random() * empties.length)];
  }
  state.hints -= 1;
  state.values[i] = state.solution[i];
  state.notes[i].clear();
  state.sel = i;
  sfx.hint();
  const btn = document.getElementById('hintBtn');
  btn.innerHTML = '💡<br>AIUTO (' + state.hints + ')';
  if (state.hints === 0) btn.disabled = true;
  renderBoard();
  renderHud();
  checkWin();
}

function checkWin() {
  for (let i = 0; i < 81; i++) if (state.values[i] !== state.solution[i]) return;
  state.screen = 'over';
  clearInterval(state.timerId);
  sfx.win();
  // Onda di vittoria
  for (let i = 0; i < 81; i++) {
    setTimeout(() => sqEls[i].classList.add('winwave'), (rowOf(i) + colOf(i)) * 40);
  }
  const best = bestTime(state.level);
  const isRecord = best === null || state.seconds < best;
  saveScore({ level: state.level, seconds: state.seconds, errors: state.errors, date: new Date().toISOString().slice(0, 10) });
  setTimeout(() => showResult(isRecord), 1400);
}

function togglePause() {
  if (state.screen === 'playing') {
    state.screen = 'paused';
    showOverlay(
      '<h2>PAUSA</h2>' +
      '<div class="series-line">IL TEMPO È FERMO</div>' +
      '<button class="primary-btn" id="resumeBtn">RIPRENDI</button>' +
      '<button class="ghost-btn" id="toMenuBtn">MENU</button>'
    );
    overlay.querySelector('#resumeBtn').addEventListener('click', togglePause);
    overlay.querySelector('#toMenuBtn').addEventListener('click', () => { sfx.ui(); showMenu(); });
  } else if (state.screen === 'paused') {
    state.screen = 'playing';
    hideOverlay();
  }
}

// ============================================================
// RENDER
// ============================================================
function conflictSet() {
  const conflicts = new Set();
  for (let i = 0; i < 81; i++) {
    const v = state.values[i];
    if (v !== 0 && peersConflict(state.values, i, v)) conflicts.add(i);
  }
  return conflicts;
}

function renderBoard() {
  if (!state.values) return;
  const conflicts = conflictSet();
  const selVal = state.sel >= 0 ? state.values[state.sel] : 0;
  const selR = state.sel >= 0 ? rowOf(state.sel) : -1;
  const selC = state.sel >= 0 ? colOf(state.sel) : -1;
  const selB = state.sel >= 0 ? boxOf(state.sel) : -1;

  for (let i = 0; i < 81; i++) {
    const d = sqEls[i];
    const v = state.values[i];
    let cls = 'sq';
    if (colOf(i) === 2 || colOf(i) === 5) cls += ' bR';
    if (rowOf(i) === 2 || rowOf(i) === 5) cls += ' bB';
    if (state.puzzle[i] !== 0) cls += ' given';
    if (state.sel === i) cls += ' sel';
    else if (state.sel >= 0 && (rowOf(i) === selR || colOf(i) === selC || boxOf(i) === selB)) cls += ' hl';
    if (selVal !== 0 && v === selVal && i !== state.sel) cls += ' same';
    if (conflicts.has(i)) cls += ' conflict';
    d.className = cls;

    if (v !== 0) {
      d.textContent = v;
    } else if (state.notes[i].size > 0) {
      let html = '<div class="notes">';
      for (let n = 1; n <= 9; n++) html += '<span>' + (state.notes[i].has(n) ? n : '') + '</span>';
      d.innerHTML = html + '</div>';
    } else {
      d.textContent = '';
    }
  }

  // Contatori sul tastierino
  const counts = Array(10).fill(0);
  for (let i = 0; i < 81; i++) counts[state.values[i]]++;
  for (let v = 1; v <= 9; v++) {
    numBtns[v - 1].classList.toggle('done', counts[v] >= 9);
    numBtns[v - 1].querySelector('.count').textContent = 9 - counts[v] > 0 ? (9 - counts[v]) : '';
  }
}

function fmtTime(s) {
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function renderTime() {
  document.getElementById('hudTime').textContent = fmtTime(state.seconds);
}

function renderHud() {
  document.getElementById('hudLevel').textContent = LEVELS[state.level] ? LEVELS[state.level].name : '—';
  document.getElementById('hudErrors').textContent = state.errors;
  const best = bestTime(state.level);
  document.getElementById('hudBest').textContent = best !== null ? fmtTime(best) : '—';
  renderTime();
}

// ============================================================
// OVERLAY
// ============================================================
function showOverlay(html) {
  overlay.innerHTML = '<div class="overlay-content">' + html + '</div>';
  overlay.classList.add('show');
}
function hideOverlay() { overlay.classList.remove('show'); }

function scoresPanelHtml() {
  const scores = loadScores().slice(0, 8);
  let rows = '';
  const bests = {};
  for (const s of loadScores()) if (!(s.level in bests)) bests[s.level] = s.seconds;
  for (const s of scores) {
    const rec = bests[s.level] === s.seconds;
    rows += '<div class="score-row' + (rec ? ' record' : '') + '">' +
      '<span class="s-mode">' + LEVELS[s.level].name + '</span>' +
      '<span class="s-meta">' + s.date + ' · ' + s.errors + ' err</span>' +
      '<span class="s-score">' + fmtTime(s.seconds) + '</span></div>';
  }
  const body = rows || '<div class="scores-empty">Nessuna partita completata</div>';
  return '<div class="scores-panel"><div class="scores-title">TEMPI MIGLIORI</div>' + body +
    '<button class="ghost-btn" id="clearScores">CANCELLA TEMPI</button></div>';
}

function showMenu() {
  state.screen = 'menu';
  clearInterval(state.timerId);
  showOverlay(
    '<h2>SUDOKU</h2>' +
    '<div class="series-line">OGNI SCHEMA È GENERATO AL MOMENTO<br>E HA UNA SOLA SOLUZIONE</div>' +
    '<div class="mode-grid">' +
    '<button class="mode-card" data-level="easy"><div class="mode-icon">🌱</div><div class="mode-name">FACILE</div><div class="mode-desc">40 numeri dati</div></button>' +
    '<button class="mode-card" data-level="medium"><div class="mode-icon">⚙️</div><div class="mode-name">MEDIO</div><div class="mode-desc">32 numeri dati</div></button>' +
    '<button class="mode-card" data-level="hard"><div class="mode-icon">🔥</div><div class="mode-name">DIFFICILE</div><div class="mode-desc">27 numeri dati</div></button>' +
    '<button class="mode-card" data-level="expert"><div class="mode-icon">💀</div><div class="mode-name">ESPERTO</div><div class="mode-desc">24 numeri dati</div></button>' +
    '</div>' +
    scoresPanelHtml()
  );
  overlay.querySelectorAll('.mode-card').forEach(btn => {
    btn.addEventListener('click', () => {
      sfx.ui();
      startGame(btn.dataset.level);
    });
  });
  const clear = overlay.querySelector('#clearScores');
  if (clear) clear.addEventListener('click', () => {
    try { localStorage.removeItem(SCORES_KEY); } catch (e) {}
    showMenu();
  });
}

function showResult(isRecord) {
  showOverlay(
    '<div class="result-title">COMPLETATO!</div>' +
    '<div class="result-time">' + fmtTime(state.seconds) + '</div>' +
    (isRecord ? '<div class="new-record">★ NUOVO RECORD ★</div>' : '') +
    '<div class="series-line">LIVELLO ' + LEVELS[state.level].name + ' · ERRORI: ' + state.errors +
    ' · AIUTI USATI: ' + (MAX_HINTS - state.hints) + '</div>' +
    '<button class="primary-btn" id="againBtn">NUOVO SCHEMA</button>' +
    '<button class="ghost-btn" id="toMenuBtn">MENU</button>'
  );
  overlay.querySelector('#againBtn').addEventListener('click', () => { sfx.ui(); startGame(state.level); });
  overlay.querySelector('#toMenuBtn').addEventListener('click', () => { sfx.ui(); showMenu(); });
}

// ============================================================
// INPUT DA TASTIERA
// ============================================================
document.addEventListener('keydown', (e) => {
  if (state.screen === 'paused' && (e.key === 'p' || e.key === 'P' || e.key === 'Escape')) { togglePause(); return; }
  if (state.screen !== 'playing') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) { inputValue(n); return; }
  switch (e.key) {
    case 'Backspace': case 'Delete': case '0': eraseCell(); break;
    case 'n': case 'N': toggleNotes(); break;
    case 'p': case 'P': togglePause(); break;
    case 'm': case 'M': toggleSound(); break;
    case 'ArrowUp': if (state.sel >= 9) selectCell(state.sel - 9); e.preventDefault(); break;
    case 'ArrowDown': if (state.sel >= 0 && state.sel < 72) selectCell(state.sel + 9); else if (state.sel < 0) selectCell(0); e.preventDefault(); break;
    case 'ArrowLeft': if (state.sel > 0) selectCell(state.sel - 1); e.preventDefault(); break;
    case 'ArrowRight': if (state.sel >= 0 && state.sel < 80) selectCell(state.sel + 1); else if (state.sel < 0) selectCell(0); e.preventDefault(); break;
  }
});

function toggleNotes() {
  state.notesMode = !state.notesMode;
  document.getElementById('notesBtn').classList.toggle('active', state.notesMode);
  sfx.ui();
}

// ============================================================
// PULSANTI
// ============================================================
document.getElementById('notesBtn').addEventListener('click', toggleNotes);
document.getElementById('eraseBtn').addEventListener('click', eraseCell);
document.getElementById('hintBtn').addEventListener('click', useHint);
document.getElementById('pauseBtn').addEventListener('click', togglePause);

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('sudoku-neon-sound', soundOn);
  document.getElementById('soundBtn').style.opacity = soundOn ? '1' : '0.4';
  if (soundOn) sfx.ui();
}
document.getElementById('soundBtn').addEventListener('click', toggleSound);
document.getElementById('soundBtn').style.opacity = soundOn ? '1' : '0.4';
document.getElementById('menuBtn').addEventListener('click', () => { sfx.ui(); showMenu(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.screen === 'playing') togglePause();
});

// ============================================================
// AVVIO
// ============================================================
showMenu();
</script>
</body>
</html>
