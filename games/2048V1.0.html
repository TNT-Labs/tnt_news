<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · Neon Fusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Grotesk:wght@400;500;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #050810;
    --bg-1: #0c1224;
    --fg: #e6f1ff;
    --muted: #6b7a99;
    --accent: #00ffd5;
    --accent-2: #ff2a78;
    --border: rgba(255, 255, 255, 0.08);
    --card: rgba(255, 255, 255, 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-0);
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0, 255, 213, 0.08), transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(255, 42, 120, 0.08), transparent 60%),
      radial-gradient(ellipse 60% 50% at 20% 100%, rgba(120, 80, 255, 0.06), transparent 60%),
      var(--bg-0);
    position: relative;
  }

  #bgCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-height: 100vh;
  }

  /* Header */
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }

  .title-area { flex: 1; min-width: 200px; }

  .title {
    font-family: 'Audiowide', cursive;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    background: linear-gradient(135deg, #00ffd5 0%, #4d8eff 35%, #ff2a78 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.04em;
    line-height: 1;
    animation: gradientShift 6s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(0, 255, 213, 0.25));
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subtitle {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.5em;
    color: var(--accent);
    margin-top: 6px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .scores {
    display: flex;
    gap: 10px;
  }

  .score-card {
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 8px 18px;
    min-width: 88px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .score-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  .score-card .label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    font-weight: 600;
  }

  .score-card .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--fg);
    margin-top: 2px;
    transition: transform 0.2s;
  }

  .score-card .value.bump {
    animation: bump 0.3s ease-out;
  }

  @keyframes bump {
    0% { transform: scale(1); color: var(--fg); }
    50% { transform: scale(1.15); color: var(--accent); }
    100% { transform: scale(1); color: var(--fg); }
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    width: 100%;
    flex-wrap: wrap;
  }

  .btn {
    background: rgba(255, 255, 255, 0.04);
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 10px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    min-width: 100px;
    text-transform: uppercase;
  }

  .btn:hover:not(:disabled) {
    background: rgba(0, 255, 213, 0.08);
    border-color: rgba(0, 255, 213, 0.4);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .btn-primary {
    background: linear-gradient(135deg, rgba(0, 255, 213, 0.15), rgba(0, 184, 255, 0.1));
    border-color: rgba(0, 255, 213, 0.3);
    color: var(--accent);
  }

  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(0, 255, 213, 0.25), rgba(0, 184, 255, 0.2));
    box-shadow: 0 0 24px rgba(0, 255, 213, 0.25);
  }

  /* Board */
  .board-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .board {
    --gap: clamp(8px, 2.5vw, 12px);
    position: relative;
    width: min(92vw, 480px);
    aspect-ratio: 1;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: var(--gap);
    box-shadow:
      0 0 40px rgba(0, 255, 213, 0.08),
      inset 0 0 60px rgba(0, 255, 213, 0.04),
      0 20px 60px rgba(0, 0, 0, 0.5);
    touch-action: none;
  }

  .board::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(0, 255, 213, 0.3), transparent 40%, transparent 60%, rgba(255, 42, 120, 0.3));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .grid-bg {
    position: absolute;
    inset: var(--gap);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
  }

  .cell-bg {
    background: rgba(255, 255, 255, 0.025);
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.02);
  }

  .tiles-container {
    --tile-size: calc((100% - 3 * var(--gap)) / 4);
    position: absolute;
    inset: var(--gap);
    pointer-events: none;
  }

  .tile-wrapper {
    position: absolute;
    width: var(--tile-size);
    height: var(--tile-size);
    top: 0;
    left: 0;
    /* Nel transform le percentuali si riferiscono alla tessera stessa,
       quindi il passo di una cella è 100% (lato tessera) + gap */
    transform: translate(
      calc(var(--col) * (100% + var(--gap))),
      calc(var(--row) * (100% + var(--gap)))
    );
    transition: transform 0.13s ease-out;
    will-change: transform;
  }

  .tile {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: calc(var(--tile-size) * 0.4);
    letter-spacing: -0.02em;
    user-select: none;
    position: relative;
    overflow: hidden;
  }

  .tile[data-digits="3"] { font-size: calc(var(--tile-size) * 0.32); }
  .tile[data-digits="4"] { font-size: calc(var(--tile-size) * 0.26); }
  .tile[data-digits="5"] { font-size: calc(var(--tile-size) * 0.22); }

  .tile.new {
    animation: spawn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .tile.merged {
    animation: merge 0.25s ease-out;
    z-index: 5;
  }

  @keyframes spawn {
    0% { transform: scale(0); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes merge {
    0% { transform: scale(1); }
    45% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  /* Tile color progression */
  .tile-2 {
    background: linear-gradient(135deg, #1e293b, #334155);
    color: #cbd5e1;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 2px 8px rgba(0,0,0,0.3);
  }
  .tile-4 {
    background: linear-gradient(135deg, #1e3a5f, #2563a8);
    color: #dbeafe;
    box-shadow: 0 0 14px rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .tile-8 {
    background: linear-gradient(135deg, #0e7490, #0891b2);
    color: #ecfeff;
    box-shadow: 0 0 18px rgba(8, 145, 178, 0.45), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .tile-16 {
    background: linear-gradient(135deg, #047857, #10b981);
    color: #d1fae5;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.5), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .tile-32 {
    background: linear-gradient(135deg, #65a30d, #a3e635);
    color: #1a2e05;
    box-shadow: 0 0 22px rgba(163, 230, 53, 0.55), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .tile-64 {
    background: linear-gradient(135deg, #ca8a04, #facc15);
    color: #422006;
    box-shadow: 0 0 24px rgba(250, 204, 21, 0.6), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .tile-128 {
    background: linear-gradient(135deg, #ea580c, #fb923c);
    color: #fff7ed;
    box-shadow: 0 0 26px rgba(251, 146, 60, 0.65), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .tile-256 {
    background: linear-gradient(135deg, #dc2626, #f87171);
    color: #fef2f2;
    box-shadow: 0 0 30px rgba(248, 113, 113, 0.7), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .tile-512 {
    background: linear-gradient(135deg, #db2777, #f472b6);
    color: #fdf2f8;
    box-shadow: 0 0 34px rgba(244, 114, 182, 0.75), inset 0 1px 0 rgba(255,255,255,0.22);
  }
  .tile-1024 {
    background: linear-gradient(135deg, #7c3aed, #c084fc);
    color: #faf5ff;
    box-shadow: 0 0 38px rgba(192, 132, 252, 0.8), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .tile-2048 {
    background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6);
    background-size: 200% 200%;
    color: #fff;
    box-shadow: 0 0 44px rgba(236, 72, 153, 0.9), inset 0 1px 0 rgba(255,255,255,0.3);
    animation: shineTile 3s ease-in-out infinite;
  }
  .tile-4096, .tile-8192, .tile-16384 {
    background: linear-gradient(135deg, #06b6d4, #a855f7, #ec4899);
    background-size: 200% 200%;
    color: #fff;
    box-shadow: 0 0 50px rgba(168, 85, 247, 0.95), inset 0 1px 0 rgba(255,255,255,0.3);
    animation: shineTile 2.5s ease-in-out infinite;
  }

  @keyframes shineTile {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 8, 16, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 20;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-content {
    text-align: center;
    padding: 28px;
    transform: scale(0.85);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .overlay.show .overlay-content {
    transform: scale(1);
  }

  .overlay-title {
    font-family: 'Audiowide', cursive;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    background: linear-gradient(135deg, #00ffd5, #ff2a78);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px rgba(255, 42, 120, 0.4));
  }

  .overlay-title.win {
    background: linear-gradient(135deg, #facc15, #ec4899, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 24px rgba(250, 204, 21, 0.5));
  }

  .overlay-text {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .overlay-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .overlay-btn {
    background: linear-gradient(135deg, #00ffd5, #00b8ff);
    color: #060914;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    box-shadow: 0 0 24px rgba(0, 255, 213, 0.35);
  }

  .overlay-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 32px rgba(0, 255, 213, 0.55);
  }

  .overlay-btn.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    box-shadow: none;
  }

  .overlay-btn.secondary:hover {
    background: rgba(255,255,255,0.05);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 20px rgba(0, 255, 213, 0.2);
  }

  .hidden { display: none !important; }

  /* Score float */
  .score-float {
    position: absolute;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 30;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -50px); }
  }

  /* Instructions */
  .instructions {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    backdrop-filter: blur(10px);
  }

  .instructions h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .instructions p {
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.6;
  }

  .instructions strong {
    color: var(--fg);
    font-weight: 600;
  }

  .keys {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-top: 14px;
  }

  .keys-row {
    display: flex;
    gap: 4px;
  }

  kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 6px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    color: var(--fg);
  }

  /* Tile preview */
  .tile-preview {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 12px;
    justify-content: center;
  }

  .preview-tile {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    font-weight: 800;
  }

  @media (max-width: 420px) {
    .container { padding: 16px 12px 32px; }
    .scores { gap: 6px; }
    .score-card { padding: 6px 12px; min-width: 72px; }
    .score-card .value { font-size: 1.1rem; }
    .btn { padding: 9px 10px; font-size: 0.7rem; min-width: 80px; }
  }
</style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <main class="container">
    <header>
      <div class="title-area">
        <h1 class="title">2048</h1>
        <div class="subtitle">Neon Fusion</div>
      </div>
      <div class="scores">
        <div class="score-card">
          <div class="label">SCORE</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-card">
          <div class="label">BEST</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <button class="btn btn-primary" id="newGame">Nuova partita</button>
      <button class="btn" id="undo" disabled>Annulla</button>
      <button class="btn" id="sound">Audio: On</button>
    </div>

    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="grid-bg" id="gridBg"></div>
        <div class="tiles-container" id="tileContainer"></div>
        <div class="overlay" id="overlay">
          <div class="overlay-content">
            <h2 class="overlay-title" id="overlayTitle">Game Over</h2>
            <p class="overlay-text" id="overlayText"></p>
            <div class="overlay-buttons">
              <button class="overlay-btn secondary hidden" id="overlayContinue">Continua</button>
              <button class="overlay-btn" id="overlayRestart">Ricomincia</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="instructions">
      <h3>Come giocare</h3>
      <p>Usa le <strong>frecce</strong> o <strong>WASD</strong> per muovere le tessere. Su mobile, <strong>scorri</strong> con il dito. Quando due tessere con lo stesso numero si toccano, si <strong>fondono</strong> in una sola. Raggiungi la tessera <strong>2048</strong> per vincere!</p>
      <div class="keys">
        <div class="keys-row"><kbd>W</kbd> <kbd>↑</kbd></div>
        <div class="keys-row"><kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> &nbsp; <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd></div>
      </div>
      <div class="tile-preview" id="tilePreview"></div>
    </div>
  </main>

<script>
// ============ Configurazione ============
const SIZE = 4;
const MOVE_DURATION = 130;

// ============ Stato ============
let grid = [];
let tiles = [];
let score = 0;
let best = parseInt(localStorage.getItem('best2048neon')) || 0;
let nextId = 1;
let gameOver = false;
let won = false;
let canContinue = false;
let history = [];
let soundOn = localStorage.getItem('sound2048neon') !== 'off';
let isMoving = false;

// ============ Audio ============
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'move') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(180, now);
    o.frequency.exponentialRampToValueAtTime(120, now + 0.08);
    g.gain.setValueAtTime(0.04, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    o.start(now); o.stop(now + 0.1);
  } else if (type === 'merge') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle';
    o.frequency.setValueAtTime(320, now);
    o.frequency.exponentialRampToValueAtTime(640, now + 0.18);
    g.gain.setValueAtTime(0.07, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    o.start(now); o.stop(now + 0.23);
  } else if (type === 'gameover') {
    [330, 247, 196, 130].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sawtooth';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.05, now + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.25);
      o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.3);
    });
  } else if (type === 'win') {
    [523, 659, 784, 1047, 1319].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.06, now + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.3);
      o.start(now + i * 0.09); o.stop(now + i * 0.09 + 0.31);
    });
  }
}

// ============ DOM ============
const tileContainer = document.getElementById('tileContainer');
const gridBg = document.getElementById('gridBg');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const overlayContinue = document.getElementById('overlayContinue');
const overlayRestart = document.getElementById('overlayRestart');
const undoBtn = document.getElementById('undo');
const soundBtn = document.getElementById('sound');
const newGameBtn = document.getElementById('newGame');
const board = document.getElementById('board');

// Costruisce la griglia di sfondo
for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell-bg';
  gridBg.appendChild(cell);
}

// Anteprima tile
const tilePreview = document.getElementById('tilePreview');
[2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048].forEach(v => {
  const t = document.createElement('div');
  t.className = 'preview-tile tile-' + v;
  t.textContent = v;
  tilePreview.appendChild(t);
});

// ============ Logica di gioco ============
function init() {
  grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  tiles = [];
  score = 0;
  gameOver = false;
  won = false;
  canContinue = false;
  history = [];
  isMoving = false;
  tileContainer.innerHTML = '';
  addRandomTile();
  addRandomTile();
  render(true);
  updateScore();
  updateUndoBtn();
  overlay.classList.remove('show');
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) empty.push({r, c});
    }
  }
  if (empty.length === 0) return null;
  const {r, c} = empty[Math.floor(Math.random() * empty.length)];
  const value = Math.random() < 0.9 ? 2 : 4;
  grid[r][c] = value;
  const tile = {
    id: nextId++,
    value,
    row: r,
    col: c,
    isNew: true,
    merged: false,
    toRemove: false
  };
  tiles.push(tile);
  return tile;
}

function findTile(r, c) {
  return tiles.find(t => t.row === r && t.col === c && !t.toRemove);
}

function getTraversals(direction) {
  const rows = [0, 1, 2, 3];
  const cols = [0, 1, 2, 3];
  if (direction === 'down') rows.reverse();
  if (direction === 'right') cols.reverse();
  return {rows, cols};
}

function getVector(direction) {
  return {
    up: {r: -1, c: 0},
    down: {r: 1, c: 0},
    left: {r: 0, c: -1},
    right: {r: 0, c: 1}
  }[direction];
}

function inBounds(pos) {
  return pos.r >= 0 && pos.r < SIZE && pos.c >= 0 && pos.c < SIZE;
}

function findFarthestPosition(pos, vector) {
  let prev;
  let current = pos;
  do {
    prev = current;
    current = {r: prev.r + vector.r, c: prev.c + vector.c};
  } while (inBounds(current) && grid[current.r][current.c] === 0);
  return {farthest: prev, next: inBounds(current) ? current : null};
}

function hasMoves() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) return true;
      const v = grid[r][c];
      if (r < SIZE - 1 && grid[r + 1][c] === v) return true;
      if (c < SIZE - 1 && grid[r][c + 1] === v) return true;
    }
  }
  return false;
}

function move(direction) {
  if (gameOver || isMoving) return false;

  // Snapshot per undo
  const prevGrid = grid.map(row => [...row]);
  const prevScore = score;

  // Reset flag delle tile
  tiles.forEach(t => { t.isNew = false; t.merged = false; t.toRemove = false; });

  let moved = false;
  let scoreGained = 0;
  let mergeCount = 0;

  const traversals = getTraversals(direction);
  const vector = getVector(direction);

  traversals.rows.forEach(r => {
    traversals.cols.forEach(c => {
      if (grid[r][c] === 0) return;
      const tile = findTile(r, c);
      if (!tile) return;

      const {farthest, next} = findFarthestPosition({r, c}, vector);

      let mergedNow = false;
      if (next && grid[next.r][next.c] === tile.value) {
        const otherTile = findTile(next.r, next.c);
        if (otherTile && !otherTile.merged) {
          // Merge: la tile corrente si sposta sull'altra e viene rimossa
          tile.row = next.r;
          tile.col = next.c;
          tile.toRemove = true;

          otherTile.value *= 2;
          otherTile.merged = true;

          grid[r][c] = 0;
          grid[next.r][next.c] = otherTile.value;

          scoreGained += otherTile.value;
          mergeCount++;
          if (otherTile.value === 2048 && !won) {
            won = true;
          }
          moved = true;
          mergedNow = true;
        }
      }
      // Se il merge non è possibile (es. il bersaglio ha già fuso in questa
      // mossa) la tessera deve comunque scivolare fino alla casella libera
      if (!mergedNow && (farthest.r !== r || farthest.c !== c)) {
        tile.row = farthest.r;
        tile.col = farthest.c;
        grid[r][c] = 0;
        grid[farthest.r][farthest.c] = tile.value;
        moved = true;
      }
    });
  });

  if (moved) {
    isMoving = true;
    // Salva stato per undo
    history.push({grid: prevGrid, score: prevScore});
    if (history.length > 5) history.shift();

    score += scoreGained;
    if (score > best) {
      best = score;
      localStorage.setItem('best2048neon', best);
    }

    render();
    updateScore(scoreGained > 0);
    updateUndoBtn();

    if (scoreGained > 0) {
      showScoreFloat(scoreGained);
      playSound('merge');
    } else {
      playSound('move');
    }

    // Dopo l'animazione di movimento, completa il merge e aggiungi nuova tile
    setTimeout(() => {
      tiles = tiles.filter(t => !t.toRemove);
      addRandomTile();
      render();
      isMoving = false;
      updateUndoBtn();

      if (!hasMoves()) {
        gameOver = true;
        showGameOver();
      } else if (won && !canContinue) {
        showWin();
      }
    }, MOVE_DURATION + 10);
  } else {
    // Nessun movimento, ripristina i flag
    tiles.forEach(t => { t.merged = false; t.toRemove = false; });
  }

  return moved;
}

function render(skipAnimation = false) {
  const existing = new Map();
  tileContainer.querySelectorAll('.tile-wrapper').forEach(el => {
    existing.set(parseInt(el.dataset.id), el);
  });

  tiles.forEach(tile => {
    let wrapper = existing.get(tile.id);
    let tileEl;
    let isNewEl = false;
    if (!wrapper) {
      wrapper = document.createElement('div');
      wrapper.className = 'tile-wrapper';
      wrapper.dataset.id = tile.id;
      tileEl = document.createElement('div');
      tileEl.className = 'tile';
      wrapper.appendChild(tileEl);
      tileContainer.appendChild(wrapper);
      isNewEl = true;
    } else {
      tileEl = wrapper.querySelector('.tile');
      existing.delete(tile.id);
    }

    wrapper.style.setProperty('--row', tile.row);
    wrapper.style.setProperty('--col', tile.col);

    // Aggiorna contenuto e classe
    const digits = String(tile.value).length;
    if (tileEl.textContent !== String(tile.value)) {
      tileEl.textContent = tile.value;
    }
    tileEl.dataset.digits = digits;
    tileEl.className = 'tile tile-' + tile.value;

    // Rimuovi vecchie classi di animazione
    tileEl.classList.remove('new', 'merged');
    // Forza reflow per ri-applicare l'animazione
    void tileEl.offsetWidth;

    if (tile.isNew && !skipAnimation) {
      tileEl.classList.add('new');
    }
    if (tile.merged) {
      tileEl.classList.add('merged');
    }
  });

  // Rimuovi tile orfane
  existing.forEach(el => el.remove());
}

function updateScore(bump) {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  if (bump) {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }
}

function updateUndoBtn() {
  undoBtn.disabled = history.length === 0 || isMoving;
}

function showScoreFloat(amount) {
  const float = document.createElement('div');
  float.className = 'score-float';
  float.textContent = '+' + amount;
  const rect = scoreEl.getBoundingClientRect();
  float.style.left = (rect.left + rect.width / 2) + 'px';
  float.style.top = (rect.top + window.scrollY - 8) + 'px';
  document.body.appendChild(float);
  setTimeout(() => float.remove(), 900);
}

function showGameOver() {
  overlayTitle.textContent = 'Game Over';
  overlayTitle.classList.remove('win');
  overlayText.innerHTML = 'Nessuna mossa disponibile.<br>Punteggio finale: <strong style="color:var(--accent)">' + score + '</strong>';
  overlayContinue.classList.add('hidden');
  overlayRestart.textContent = 'Ricomincia';
  overlay.classList.add('show');
  playSound('gameover');
}

function showWin() {
  overlayTitle.textContent = 'Hai vinto!';
  overlayTitle.classList.add('win');
  overlayText.innerHTML = 'Hai raggiunto la tessera <strong style="color:#facc15">2048</strong>!<br>Puoi continuare per fare più punti.';
  overlayContinue.classList.remove('hidden');
  overlayRestart.textContent = 'Nuova partita';
  overlay.classList.add('show');
  playSound('win');
}

function undo() {
  if (history.length === 0 || isMoving) return;
  const state = history.pop();
  tileContainer.innerHTML = '';
  tiles = [];
  grid = state.grid;
  score = state.score;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] !== 0) {
        tiles.push({
          id: nextId++,
          value: grid[r][c],
          row: r,
          col: c,
          isNew: false,
          merged: false,
          toRemove: false
        });
      }
    }
  }
  gameOver = false;
  overlay.classList.remove('show');
  render(true);
  updateScore();
  updateUndoBtn();
}

// ============ Input ============
document.addEventListener('keydown', (e) => {
  let dir = null;
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') dir = 'up';
  else if (k === 'ArrowDown' || k === 's' || k === 'S') dir = 'down';
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') dir = 'left';
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') dir = 'right';
  if (dir) {
    e.preventDefault();
    ensureAudio();
    move(dir);
  }
});

// Swipe su touch
let touchStartX = 0, touchStartY = 0, touchActive = false;
board.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchActive = true;
  ensureAudio();
}, {passive: true});

board.addEventListener('touchmove', (e) => {
  if (touchActive) e.preventDefault();
}, {passive: false});

board.addEventListener('touchend', (e) => {
  if (!touchActive) return;
  touchActive = false;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 25) return;
  if (absDx > absDy) {
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
}, {passive: true});

// Pulsanti
newGameBtn.addEventListener('click', () => {
  ensureAudio();
  init();
});

undoBtn.addEventListener('click', () => {
  ensureAudio();
  undo();
});

soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem('sound2048neon', soundOn ? 'on' : 'off');
  soundBtn.textContent = 'Audio: ' + (soundOn ? 'On' : 'Off');
  if (soundOn) {
    ensureAudio();
    playSound('merge');
  }
});

soundBtn.textContent = 'Audio: ' + (soundOn ? 'On' : 'Off');

overlayRestart.addEventListener('click', () => {
  init();
});

overlayContinue.addEventListener('click', () => {
  canContinue = true;
  overlay.classList.remove('show');
});

// ============ Background particles ============
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  initParticles();
}

function initParticles() {
  particles = [];
  const count = Math.floor((bgCanvas.width * bgCanvas.height) / 22000);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      size: Math.random() * 1.8 + 0.4,
      hue: Math.random() < 0.5 ? 175 : 330,
      alpha: Math.random() * 0.35 + 0.08,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function animateBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  const t = performance.now() * 0.001;
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < -10) p.x = bgCanvas.width + 10;
    if (p.x > bgCanvas.width + 10) p.x = -10;
    if (p.y < -10) p.y = bgCanvas.height + 10;
    if (p.y > bgCanvas.height + 10) p.y = -10;
    const a = p.alpha * (0.6 + 0.4 * Math.sin(t + p.phase));
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    bgCtx.fillStyle = `hsla(${p.hue}, 85%, 65%, ${a})`;
    bgCtx.fill();
    // glow
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
    bgCtx.fillStyle = `hsla(${p.hue}, 85%, 65%, ${a * 0.15})`;
    bgCtx.fill();
  });
  requestAnimationFrame(animateBg);
}

window.addEventListener('resize', resizeBg);
resizeBg();
animateBg();

// ============ Avvio ============
init();
</script>
