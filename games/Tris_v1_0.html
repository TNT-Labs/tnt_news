<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TRIS — Neon Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #08040f;
    --fg: #f1ecfa;
    --muted: rgba(255,255,255,0.45);
    --accent: #b026ff;      /* X viola */
    --accent2: #00f5ff;     /* O ciano */
    --accent3: #ff2a78;
    --gold: #ffbe0b;
    --panel: rgba(20, 10, 34, 0.55);
    --border: rgba(255,255,255,0.08);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(176,38,255,0.10), transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(0,245,255,0.07), transparent 60%),
      linear-gradient(180deg, #08040f 0%, #0e0618 50%, #0b0513 100%);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 4px);
    pointer-events: none;
    z-index: 200;
    opacity: 0.22;
    mix-blend-mode: multiply;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    gap: 10px;
    max-width: 640px;
    margin: 0 auto;
  }

  header { text-align: center; line-height: 1; }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 5vw, 36px);
    letter-spacing: 12px;
    padding-left: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #b026ff 45%, #00f5ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(176,38,255,0.5));
    animation: titleGlow 4s ease-in-out infinite;
  }

  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(176,38,255,0.5)); }
    50% { filter: drop-shadow(0 0 26px rgba(0,245,255,0.6)); }
  }

  .subtitle { font-size: 9px; letter-spacing: 6px; color: rgba(255,255,255,0.35); font-weight: 700; margin-top: 4px; }

  .hud {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .hud .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 54px; }
  .hud .label { font-size: 8px; letter-spacing: 2px; color: var(--muted); font-weight: 700; }
  .hud .value { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; color: #fff; }
  .hud .value.x { color: var(--accent); text-shadow: 0 0 10px rgba(176,38,255,0.5); }
  .hud .value.o { color: var(--accent2); text-shadow: 0 0 10px rgba(0,245,255,0.5); }

  .turn-banner {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    min-height: 16px;
    color: var(--muted);
    text-align: center;
  }
  .turn-banner.x { color: var(--accent); text-shadow: 0 0 12px rgba(176,38,255,0.6); }
  .turn-banner.o { color: var(--accent2); text-shadow: 0 0 12px rgba(0,245,255,0.6); }

  .stage { position: relative; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    width: min(78vw, 46vh, 360px);
    height: min(78vw, 46vh, 360px);
    padding: 10px;
    background: rgba(6, 3, 12, 0.8);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 0 50px rgba(176,38,255,0.12), 0 0 25px rgba(0,245,255,0.08), inset 0 0 40px rgba(0,0,0,0.6);
  }

  .cell {
    position: relative;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cell:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.16); }
  .cell.filled { cursor: default; }
  .cell.filled:hover { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.07); }

  .cell svg { width: 62%; height: 62%; display: block; }

  .cell svg path, .cell svg circle {
    fill: none;
    stroke-width: 11;
    stroke-linecap: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: draw 0.35s ease-out forwards;
  }

  .cell.x svg path { stroke: var(--accent); filter: drop-shadow(0 0 8px rgba(176,38,255,0.8)); }
  .cell.x svg path:nth-child(2) { animation-delay: 0.14s; }
  .cell.o svg circle { stroke: var(--accent2); filter: drop-shadow(0 0 8px rgba(0,245,255,0.8)); }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  .cell.win {
    background: rgba(255,190,11,0.10);
    border-color: rgba(255,190,11,0.55);
    box-shadow: 0 0 22px rgba(255,190,11,0.35), inset 0 0 18px rgba(255,190,11,0.12);
    animation: winPulse 0.9s ease-in-out infinite;
  }
  @keyframes winPulse {
    0%, 100% { box-shadow: 0 0 14px rgba(255,190,11,0.3); }
    50% { box-shadow: 0 0 30px rgba(255,190,11,0.55); }
  }

  .cell.dim svg { opacity: 0.28; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(6, 3, 12, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 40;
  }

  .overlay.show { opacity: 1; pointer-events: all; }

  .overlay-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
    max-width: 96%;
    max-height: 96%;
    overflow-y: auto;
    text-align: center;
  }

  .overlay-content h2 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 5px;
    background: linear-gradient(180deg, #fff, #b026ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .mode-grid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 420px; }

  .mode-card {
    background: rgba(24, 12, 40, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 8px;
    width: 104px;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    text-align: center;
    transition: all 0.25s;
  }

  .mode-card:hover {
    border-color: rgba(176,38,255,0.5);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(176,38,255,0.18);
  }

  .mode-icon { font-size: 20px; margin-bottom: 4px; filter: drop-shadow(0 0 8px rgba(176,38,255,0.6)); }
  .mode-name { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; margin-bottom: 4px; color: var(--accent); }
  .mode-desc { font-size: 8.5px; color: rgba(255,255,255,0.5); line-height: 1.5; }

  .symbol-row { display: flex; gap: 10px; }
  .symbol-btn {
    width: 74px; height: 74px;
    border-radius: 12px;
    background: rgba(24, 12, 40, 0.6);
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    transition: all 0.25s;
  }
  .symbol-btn.sx { color: var(--accent); text-shadow: 0 0 14px rgba(176,38,255,0.8); }
  .symbol-btn.so { color: var(--accent2); text-shadow: 0 0 14px rgba(0,245,255,0.8); }
  .symbol-btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.35); }
  .choose-note { font-size: 9px; letter-spacing: 2px; color: var(--muted); }

  .primary-btn, .ghost-btn {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 11px 30px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .primary-btn {
    background: linear-gradient(135deg, #b026ff, #00b8ff);
    color: #0a0414;
    border: none;
    box-shadow: 0 4px 22px rgba(176,38,255,0.4);
  }

  .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(176,38,255,0.6); }

  .ghost-btn { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.15); }
  .ghost-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  .result-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 4px;
  }
  .result-title.x { color: var(--accent); text-shadow: 0 0 22px rgba(176,38,255,0.7); }
  .result-title.o { color: var(--accent2); text-shadow: 0 0 22px rgba(0,245,255,0.7); }
  .result-title.draw { color: var(--muted); }

  .series-line { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.5); font-weight: 700; }

  .stats-panel {
    width: 300px;
    max-width: 84vw;
    background: rgba(24, 12, 40, 0.5);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stats-title { font-size: 9px; letter-spacing: 3px; color: var(--muted); font-weight: 700; text-align: center; margin-bottom: 6px; }
  .stats-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 10px;
    font-size: 9px;
    padding: 4px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    align-items: baseline;
  }
  .stats-row:last-child { border-bottom: none; }
  .stats-row .m { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 8.5px; letter-spacing: 1px; color: var(--accent2); }
  .stats-row .v { font-family: 'Orbitron', sans-serif; font-weight: 700; color: #fff; }
  .stats-row .l { color: rgba(255,255,255,0.4); font-size: 8px; }
  .stats-empty { text-align: center; font-size: 9px; color: rgba(255,255,255,0.35); padding: 8px 0; }
  .stats-panel .ghost-btn { display: block; width: 100%; margin-top: 8px; padding: 5px 10px; font-size: 8px; }

  footer { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 9px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
    justify-content: center;
  }

  .controls span { display: flex; align-items: center; gap: 4px; }

  kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 8px;
    color: #fff;
    min-width: 16px;
    text-align: center;
  }

  .icon-btns { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 45; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(20,10,34,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: #fff; border-color: var(--accent); box-shadow: 0 0 10px rgba(176,38,255,0.3); }

  @media (pointer: coarse) { .controls { display: none; } }

  @media (max-height: 560px) {
    header { display: none; }
    .app { gap: 6px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="title">TRIS</h1>
    <div class="subtitle">NEON GRID</div>
  </header>

  <div class="hud">
    <div class="stat"><div class="label" id="labX">X</div><div class="value x" id="hudX">0</div></div>
    <div class="stat"><div class="label">PAREGGI</div><div class="value" id="hudD">0</div></div>
    <div class="stat"><div class="label" id="labO">O</div><div class="value o" id="hudO">0</div></div>
  </div>

  <div class="turn-banner" id="turnBanner">&nbsp;</div>

  <div class="stage">
    <div class="board" id="board"></div>
    <div class="icon-btns">
      <button class="icon-btn" id="soundBtn" aria-label="Audio">♪</button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <div class="overlay" id="overlay"></div>
  </div>

  <footer>
    <div class="controls">
      <span><kbd>1</kbd>–<kbd>9</kbd> Casella (tastierino)</span>
      <span><kbd>N</kbd> Nuova partita</span>
      <span><kbd>M</kbd> Audio</span>
    </div>
  </footer>
</div>

<script>
'use strict';

// ============================================================
// COSTANTI
// ============================================================
const STATS_KEY = 'tris-neon-stats';
const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];
const MODE_NAMES = { easy: 'CPU FACILE', hard: 'CPU ESPERTO', duel: '2 GIOCATORI' };

// ============================================================
// STATO
// ============================================================
const state = {
  screen: 'menu',          // menu | choose | playing | over
  mode: 'hard',
  human: 'X',              // simbolo del giocatore umano (vs CPU)
  board: Array(9).fill(null),
  turn: 'X',
  over: false,
  winner: null,
  winLine: null,
  series: { X: 0, O: 0, D: 0 },
  lock: false              // blocco input mentre "pensa" la CPU
};

let soundOn = localStorage.getItem('tris-neon-sound') !== 'false';

// ============================================================
// STATISTICHE (localStorage)
// ============================================================
function loadStats() {
  try {
    const s = JSON.parse(localStorage.getItem(STATS_KEY));
    return s && typeof s === 'object' ? s : {};
  } catch (e) { return {}; }
}

function bumpStat(mode, key) {
  const stats = loadStats();
  if (!stats[mode]) stats[mode] = { win: 0, lose: 0, draw: 0 };
  stats[mode][key] += 1;
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
}

// ============================================================
// AUDIO (WebAudio, nessun file esterno)
// ============================================================
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq, dur, type, vol, delay) {
  if (!soundOn) return;
  try {
    const ctx = ac();
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}

const sfx = {
  place(sym) { beep(sym === 'X' ? 520 : 400, 0.09, 'triangle', 0.18); },
  win() { beep(523, 0.12, 'triangle', 0.2); beep(659, 0.12, 'triangle', 0.2, 0.1); beep(784, 0.2, 'triangle', 0.22, 0.2); },
  lose() { beep(330, 0.16, 'sawtooth', 0.12); beep(247, 0.16, 'sawtooth', 0.12, 0.14); beep(196, 0.3, 'sawtooth', 0.14, 0.28); },
  draw() { beep(392, 0.12, 'sine', 0.15); beep(392, 0.12, 'sine', 0.15, 0.15); },
  ui() { beep(700, 0.05, 'square', 0.06); }
};

// ============================================================
// LOGICA DI GIOCO
// ============================================================
function checkWinner(b) {
  for (const line of LINES) {
    const [a, c, d] = line;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { sym: b[a], line };
  }
  return b.every(Boolean) ? { sym: null, line: null } : null;
}

// Minimax con potatura: la CPU esperta è imbattibile.
function minimax(b, turn, me, alpha, beta) {
  const res = checkWinner(b);
  if (res) {
    if (res.sym === me) return 10;
    if (res.sym === null) return 0;
    return -10;
  }
  const maximizing = turn === me;
  let best = maximizing ? -Infinity : Infinity;
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = turn;
    // Penalizza le vittorie lente / preferisce perdere il più tardi possibile
    let v = minimax(b, turn === 'X' ? 'O' : 'X', me, alpha, beta);
    b[i] = null;
    if (v > 0) v -= 1;
    else if (v < 0) v += 1;
    if (maximizing) {
      if (v > best) best = v;
      if (best > alpha) alpha = best;
    } else {
      if (v < best) best = v;
      if (best < beta) beta = best;
    }
    if (alpha >= beta) break;
  }
  return best;
}

function bestMove(b, me) {
  let best = -Infinity;
  let moves = [];
  for (let i = 0; i < 9; i++) {
    if (b[i]) continue;
    b[i] = me;
    const v = minimax(b, me === 'X' ? 'O' : 'X', me, -Infinity, Infinity);
    b[i] = null;
    if (v > best) { best = v; moves = [i]; }
    else if (v === best) moves.push(i);
  }
  return moves[Math.floor(Math.random() * moves.length)];
}

// CPU facile: mossa casuale, ma vince se può e blocca metà delle volte.
function easyMove(b, me) {
  const free = [];
  for (let i = 0; i < 9; i++) if (!b[i]) free.push(i);
  const opp = me === 'X' ? 'O' : 'X';
  for (const i of free) { b[i] = me; const w = checkWinner(b); b[i] = null; if (w && w.sym === me) return i; }
  if (Math.random() < 0.5) {
    for (const i of free) { b[i] = opp; const w = checkWinner(b); b[i] = null; if (w && w.sym === opp) return i; }
  }
  return free[Math.floor(Math.random() * free.length)];
}

// ============================================================
// DOM
// ============================================================
const boardEl = document.getElementById('board');
const overlay = document.getElementById('overlay');
const turnBanner = document.getElementById('turnBanner');
const cells = [];

for (let i = 0; i < 9; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  c.dataset.i = i;
  c.addEventListener('click', () => humanPlay(i));
  boardEl.appendChild(c);
  cells.push(c);
}

const SVG_X = '<svg viewBox="0 0 100 100"><path d="M18 18 L82 82"/><path d="M82 18 L18 82"/></svg>';
const SVG_O = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="32"/></svg>';

function renderCell(i) {
  const v = state.board[i];
  const c = cells[i];
  c.className = 'cell' + (v ? ' filled ' + v.toLowerCase() : '');
  c.innerHTML = v ? (v === 'X' ? SVG_X : SVG_O) : '';
}

function renderBoard() {
  for (let i = 0; i < 9; i++) renderCell(i);
}

function updateHud() {
  document.getElementById('hudX').textContent = state.series.X;
  document.getElementById('hudO').textContent = state.series.O;
  document.getElementById('hudD').textContent = state.series.D;
  const lx = document.getElementById('labX');
  const lo = document.getElementById('labO');
  if (state.mode === 'duel') { lx.textContent = 'X'; lo.textContent = 'O'; }
  else {
    lx.textContent = state.human === 'X' ? 'TU (X)' : 'CPU (X)';
    lo.textContent = state.human === 'O' ? 'TU (O)' : 'CPU (O)';
  }
}

function updateTurnBanner() {
  if (state.screen !== 'playing') { turnBanner.textContent = ' '; turnBanner.className = 'turn-banner'; return; }
  let text;
  if (state.mode === 'duel') text = 'TOCCA A ' + state.turn;
  else text = state.turn === state.human ? 'TOCCA A TE (' + state.turn + ')' : 'LA CPU PENSA…';
  turnBanner.textContent = text;
  turnBanner.className = 'turn-banner ' + state.turn.toLowerCase();
}

// ============================================================
// SVOLGIMENTO PARTITA
// ============================================================
function startGame(firstTurn) {
  state.board = Array(9).fill(null);
  state.turn = firstTurn || 'X';
  state.over = false;
  state.winner = null;
  state.winLine = null;
  state.lock = false;
  state.screen = 'playing';
  hideOverlay();
  renderBoard();
  updateHud();
  updateTurnBanner();
  if (state.mode !== 'duel' && state.turn !== state.human) cpuTurn();
}

function humanPlay(i) {
  if (state.screen !== 'playing' || state.over || state.lock) return;
  if (state.board[i]) return;
  if (state.mode !== 'duel' && state.turn !== state.human) return;
  place(i);
}

function place(i) {
  state.board[i] = state.turn;
  renderCell(i);
  sfx.place(state.turn);
  const res = checkWinner(state.board);
  if (res) { endGame(res); return; }
  state.turn = state.turn === 'X' ? 'O' : 'X';
  updateTurnBanner();
  if (state.mode !== 'duel' && state.turn !== state.human) cpuTurn();
}

function cpuTurn() {
  state.lock = true;
  const cpu = state.human === 'X' ? 'O' : 'X';
  setTimeout(() => {
    if (state.screen !== 'playing' || state.over) { state.lock = false; return; }
    const i = state.mode === 'hard' ? bestMove(state.board.slice(), cpu) : easyMove(state.board, cpu);
    state.lock = false;
    place(i);
  }, 380 + Math.random() * 320);
}

function endGame(res) {
  state.over = true;
  state.winner = res.sym;
  state.winLine = res.line;
  if (res.sym) {
    state.series[res.sym] += 1;
    for (const i of res.line) cells[i].classList.add('win');
    for (let i = 0; i < 9; i++) if (!res.line.includes(i)) cells[i].classList.add('dim');
  } else {
    state.series.D += 1;
  }
  updateHud();

  if (state.mode === 'duel') {
    if (res.sym) sfx.win(); else sfx.draw();
    if (res.sym === null) bumpStat('duel', 'draw');
    else bumpStat('duel', 'win');
  } else {
    if (res.sym === null) { sfx.draw(); bumpStat(state.mode, 'draw'); }
    else if (res.sym === state.human) { sfx.win(); bumpStat(state.mode, 'win'); }
    else { sfx.lose(); bumpStat(state.mode, 'lose'); }
  }

  setTimeout(showResult, res.sym ? 1100 : 700);
}

// ============================================================
// OVERLAY / SCHERMATE
// ============================================================
function showOverlay(html) {
  overlay.innerHTML = '<div class="overlay-content">' + html + '</div>';
  overlay.classList.add('show');
}
function hideOverlay() { overlay.classList.remove('show'); }

function statsPanelHtml() {
  const stats = loadStats();
  const keys = ['easy', 'hard', 'duel'];
  let rows = '';
  for (const k of keys) {
    const s = stats[k];
    if (!s) continue;
    if (k === 'duel') {
      rows += '<div class="stats-row"><span class="m">' + MODE_NAMES[k] + '</span>' +
        '<span class="v">' + s.win + '</span><span class="l">partite</span>' +
        '<span class="l">' + s.draw + ' pareggi</span></div>';
    } else {
      rows += '<div class="stats-row"><span class="m">' + MODE_NAMES[k] + '</span>' +
        '<span class="v">' + s.win + 'V</span><span class="v">' + s.lose + 'S</span>' +
        '<span class="v">' + s.draw + 'P</span></div>';
    }
  }
  const body = rows || '<div class="stats-empty">Nessuna partita giocata</div>';
  return '<div class="stats-panel"><div class="stats-title">STATISTICHE</div>' + body +
    '<button class="ghost-btn" id="clearStats">CANCELLA STATISTICHE</button></div>';
}

function showMenu() {
  state.screen = 'menu';
  updateTurnBanner();
  showOverlay(
    '<h2>TRIS</h2>' +
    '<div class="mode-grid">' +
    '<button class="mode-card" data-mode="easy"><div class="mode-icon">🌱</div><div class="mode-name">CPU FACILE</div><div class="mode-desc">La CPU si distrae: puoi vincere</div></button>' +
    '<button class="mode-card" data-mode="hard"><div class="mode-icon">🧠</div><div class="mode-name">CPU ESPERTO</div><div class="mode-desc">Minimax: al massimo pareggi</div></button>' +
    '<button class="mode-card" data-mode="duel"><div class="mode-icon">⚔️</div><div class="mode-name">2 GIOCATORI</div><div class="mode-desc">Sfida sullo stesso schermo</div></button>' +
    '</div>' +
    statsPanelHtml()
  );
  overlay.querySelectorAll('.mode-card').forEach(btn => {
    btn.addEventListener('click', () => {
      sfx.ui();
      state.mode = btn.dataset.mode;
      state.series = { X: 0, O: 0, D: 0 };
      if (state.mode === 'duel') { updateHud(); startGame('X'); }
      else showChooseSymbol();
    });
  });
  const clear = overlay.querySelector('#clearStats');
  if (clear) clear.addEventListener('click', () => {
    try { localStorage.removeItem(STATS_KEY); } catch (e) {}
    showMenu();
  });
}

function showChooseSymbol() {
  state.screen = 'choose';
  showOverlay(
    '<h2>SCEGLI</h2>' +
    '<div class="choose-note">X INIZIA SEMPRE PER PRIMO</div>' +
    '<div class="symbol-row">' +
    '<button class="symbol-btn sx" data-sym="X">X</button>' +
    '<button class="symbol-btn so" data-sym="O">O</button>' +
    '</div>' +
    '<button class="ghost-btn" id="backBtn">INDIETRO</button>'
  );
  overlay.querySelectorAll('.symbol-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      sfx.ui();
      state.human = btn.dataset.sym;
      updateHud();
      startGame('X');
    });
  });
  overlay.querySelector('#backBtn').addEventListener('click', showMenu);
}

function showResult() {
  state.screen = 'over';
  let title, cls;
  if (state.winner === null) { title = 'PAREGGIO'; cls = 'draw'; }
  else if (state.mode === 'duel') { title = 'VINCE ' + state.winner; cls = state.winner.toLowerCase(); }
  else if (state.winner === state.human) { title = 'HAI VINTO!'; cls = state.winner.toLowerCase(); }
  else { title = 'HAI PERSO'; cls = state.winner.toLowerCase(); }

  const series = state.mode === 'duel'
    ? 'SERIE — X: ' + state.series.X + ' · O: ' + state.series.O + ' · PAREGGI: ' + state.series.D
    : 'SERIE — TU: ' + state.series[state.human] + ' · CPU: ' + state.series[state.human === 'X' ? 'O' : 'X'] + ' · PAREGGI: ' + state.series.D;

  showOverlay(
    '<div class="result-title ' + cls + '">' + title + '</div>' +
    '<div class="series-line">' + series + '</div>' +
    '<button class="primary-btn" id="againBtn">RIVINCITA</button>' +
    '<button class="ghost-btn" id="toMenuBtn">MENU</button>'
  );
  // Nella rivincita inizia chi ha perso (o si alterna in caso di pareggio)
  overlay.querySelector('#againBtn').addEventListener('click', () => {
    sfx.ui();
    let first = 'X';
    if (state.mode !== 'duel' && state.winner === state.human) {
      // ha perso la CPU: se la CPU è X inizia comunque X (cioè la CPU)
      first = 'X';
    }
    startGame(first);
  });
  overlay.querySelector('#toMenuBtn').addEventListener('click', () => { sfx.ui(); showMenu(); });
}

// ============================================================
// INPUT DA TASTIERA
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') { toggleSound(); return; }
  if (e.key === 'n' || e.key === 'N') {
    if (state.screen === 'playing' || state.screen === 'over') startGame('X');
    return;
  }
  // Tastierino numerico stile telefono: 7 8 9 in alto? No: 1..9 da alto-sx
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) {
    // layout tastierino: 1 in basso a sinistra → riga = 2 - floor((n-1)/3)
    const row = 2 - Math.floor((n - 1) / 3);
    const col = (n - 1) % 3;
    humanPlay(row * 3 + col);
  }
});

// ============================================================
// PULSANTI
// ============================================================
function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('tris-neon-sound', soundOn);
  document.getElementById('soundBtn').style.opacity = soundOn ? '1' : '0.4';
  if (soundOn) sfx.ui();
}

document.getElementById('soundBtn').addEventListener('click', toggleSound);
document.getElementById('soundBtn').style.opacity = soundOn ? '1' : '0.4';
document.getElementById('menuBtn').addEventListener('click', () => { sfx.ui(); showMenu(); });

// ============================================================
// AVVIO
// ============================================================
renderBoard();
updateHud();
showMenu();
</script>
</body>
</html>
