<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZIP — Neon Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #040a06;
    --fg: #eafbef;
    --muted: rgba(255,255,255,0.45);
    --accent: #c6ff3a;
    --accent2: #00e5ff;
    --err: #ff2a5e;
    --gold: #ffbe0b;
    --panel: rgba(10, 26, 16, 0.55);
    --border: rgba(255,255,255,0.08);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(198,255,58,0.08), transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(0,229,255,0.06), transparent 60%),
      linear-gradient(180deg, #040a06 0%, #07130c 50%, #050f08 100%);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 4px);
    pointer-events: none;
    z-index: 200;
    opacity: 0.22;
    mix-blend-mode: multiply;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    gap: 10px;
    max-width: 560px;
    margin: 0 auto;
  }

  header { text-align: center; line-height: 1; }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 34px);
    letter-spacing: 14px;
    padding-left: 14px;
    background: linear-gradient(180deg, #ffffff 0%, #c6ff3a 45%, #00e5ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(198,255,58,0.5));
    animation: titleGlow 4s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(198,255,58,0.5)); }
    50% { filter: drop-shadow(0 0 26px rgba(0,229,255,0.6)); }
  }
  .subtitle { font-size: 9px; letter-spacing: 6px; color: rgba(255,255,255,0.35); font-weight: 700; margin-top: 4px; }

  .hud {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .hud .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 54px; }
  .hud .label { font-size: 8px; letter-spacing: 2px; color: var(--muted); font-weight: 700; }
  .hud .value { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(198,255,58,0.4); }

  .stage { position: relative; touch-action: none; }

  .board {
    position: relative;
    display: grid;
    background: rgba(3, 8, 5, 0.85);
    border: 2px solid rgba(198,255,58,0.4);
    border-radius: 12px;
    box-shadow: 0 0 50px rgba(198,255,58,0.10), inset 0 0 40px rgba(0,0,0,0.6);
    touch-action: none;
    overflow: hidden;
  }

  .cell {
    position: relative;
    border-right: 1px solid rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell.lastcol { border-right: none; }
  .cell.lastrow { border-bottom: none; }
  .cell.filled { background: rgba(198,255,58,0.10); }

  .num {
    position: relative;
    z-index: 3;
    width: 66%;
    height: 66%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1b2a10, #0b1207);
    border: 2px solid var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(12px, 3.6vw, 20px);
    box-shadow: 0 0 10px rgba(198,255,58,0.35);
  }
  .num.start { border-color: var(--accent2); box-shadow: 0 0 12px rgba(0,229,255,0.5); }
  .num.done { background: radial-gradient(circle at 35% 30%, #2a3a12, #16220b); }

  svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  .wall { stroke: #ff2a5e; stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(255,42,94,0.7)); }
  .pathline { fill: none; stroke: url(#zipgrad); stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(198,255,58,0.5)); }
  .pathhead { fill: #fff; filter: drop-shadow(0 0 8px rgba(0,229,255,0.9)); }

  .toolbar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .tool {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 9px 14px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.75);
    cursor: pointer;
    transition: all 0.15s;
  }
  .tool:hover { color: #fff; border-color: rgba(198,255,58,0.5); box-shadow: 0 0 10px rgba(198,255,58,0.2); }
  .tool:disabled { opacity: 0.3; cursor: default; }

  .overlay-scr {
    position: fixed;
    inset: 0;
    background: rgba(4, 10, 6, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
  }
  .overlay-scr.show { opacity: 1; pointer-events: all; }

  .ov-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px;
    max-width: 94%;
    max-height: 94%;
    overflow-y: auto;
    text-align: center;
    background: rgba(10, 26, 16, 0.7);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .ov-content h2 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 5px;
    background: linear-gradient(180deg, #fff, #c6ff3a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .mode-grid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 440px; }
  .mode-card {
    background: rgba(16, 34, 20, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 8px;
    width: 96px;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    text-align: center;
    transition: all 0.25s;
  }
  .mode-card:hover { border-color: rgba(198,255,58,0.5); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(198,255,58,0.18); }
  .mode-icon { font-size: 20px; margin-bottom: 4px; filter: drop-shadow(0 0 8px rgba(198,255,58,0.6)); }
  .mode-name { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; margin-bottom: 4px; color: var(--accent); }
  .mode-desc { font-size: 8.5px; color: rgba(255,255,255,0.5); line-height: 1.5; }

  .primary-btn, .ghost-btn {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 11px 30px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .primary-btn {
    background: linear-gradient(135deg, #c6ff3a, #00e5ff);
    color: #05130a;
    border: none;
    box-shadow: 0 4px 22px rgba(198,255,58,0.4);
  }
  .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(198,255,58,0.6); }
  .ghost-btn { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.15); }
  .ghost-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  .result-title { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 4px; color: var(--accent); text-shadow: 0 0 22px rgba(198,255,58,0.7); }
  .result-time { font-family: 'Orbitron', sans-serif; font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 0 18px rgba(0,229,255,0.6); }
  .new-record { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px; letter-spacing: 4px; color: var(--gold); animation: recPulse 1.2s ease-in-out infinite; }
  @keyframes recPulse { 0%,100% { text-shadow: 0 0 10px rgba(255,190,11,0.6); } 50% { text-shadow: 0 0 24px rgba(255,190,11,1); } }
  .series-line { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.5); font-weight: 700; line-height: 1.7; }

  .help-list { font-size: 10px; color: rgba(255,255,255,0.65); line-height: 1.9; text-align: left; max-width: 340px; }
  .help-list strong { color: var(--accent); }

  .icon-btns { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 90; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(10,26,16,0.7); border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7); font-size: 13px; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: #fff; border-color: var(--accent); box-shadow: 0 0 10px rgba(198,255,58,0.3); }

  @media (max-height: 680px) { header { display: none; } .app { gap: 6px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="title">ZIP</h1>
    <div class="subtitle">NEON PATH</div>
  </header>

  <div class="hud">
    <div class="stat"><div class="label">LIVELLO</div><div class="value" id="hudLevel" style="font-size:11px">—</div></div>
    <div class="stat"><div class="label">TEMPO</div><div class="value" id="hudTime">0:00</div></div>
    <div class="stat"><div class="label">CELLE</div><div class="value" id="hudCells">0/0</div></div>
    <div class="stat"><div class="label">RECORD</div><div class="value" id="hudBest">—</div></div>
  </div>

  <div class="stage">
    <div class="board" id="board"></div>
  </div>

  <div class="toolbar">
    <button class="tool" id="undoBtn">↶ INDIETRO</button>
    <button class="tool" id="clearBtn">✕ PULISCI</button>
    <button class="tool" id="hintBtn">💡 AIUTO</button>
    <button class="tool" id="newBtn">⟳ NUOVO</button>
  </div>

  <div class="icon-btns">
    <button class="icon-btn" id="helpBtn" aria-label="Regole">?</button>
    <button class="icon-btn" id="soundBtn" aria-label="Audio">♪</button>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>

  <div class="overlay-scr" id="overlay"></div>
</div>

<script>
'use strict';

// ============================================================
// COSTANTI
// ============================================================
const STATS_KEY = 'zip-neon-scores';
const LEVELS = {
  facile:   { name: 'FACILE',    N: 5, checkpoints: 6, budget: 150000 },
  medio:    { name: 'MEDIO',     N: 6, checkpoints: 7, budget: 150000 },
  difficile:{ name: 'DIFFICILE', N: 7, checkpoints: 7, budget: 150000 },
  esperto:  { name: 'ESPERTO',   N: 7, checkpoints: 5, budget: 150000 }
};

// ============================================================
// STATO
// ============================================================
const state = {
  screen: 'menu',       // menu | playing | over
  level: 'medio',
  N: 6,
  puzzle: null,         // { N, wallSet:Set, numberOf:Int32Array, K, solution, startCell, endCell }
  path: [],             // celle visitate in ordine
  inPath: null,         // Uint8Array
  drawing: false,
  won: false,
  seconds: 0,
  timerId: null
};
let soundOn = localStorage.getItem('zip-neon-sound') !== 'false';

// ============================================================
// PUNTEGGI (tempi migliori)
// ============================================================
function loadScores() {
  try { const s = JSON.parse(localStorage.getItem(STATS_KEY)); return Array.isArray(s) ? s : []; }
  catch (e) { return []; }
}
function saveScore(entry) {
  const s = loadScores(); s.push(entry); s.sort((a, b) => a.seconds - b.seconds);
  try { localStorage.setItem(STATS_KEY, JSON.stringify(s.slice(0, 40))); } catch (e) {}
}
function bestTime(level) {
  const s = loadScores().filter(x => x.level === level);
  return s.length ? s[0].seconds : null;
}

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function ac() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function beep(freq, dur, type, vol, delay) {
  if (!soundOn) return;
  try {
    const ctx = ac(); const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  step() { beep(360 + Math.min(state.path.length, 30) * 12, 0.045, 'triangle', 0.09); },
  back() { beep(240, 0.05, 'sine', 0.08); },
  check() { beep(680, 0.09, 'triangle', 0.14); beep(920, 0.1, 'triangle', 0.13, 0.06); },
  win() { beep(523, 0.12, 'triangle', 0.2); beep(659, 0.12, 'triangle', 0.2, 0.1); beep(784, 0.12, 'triangle', 0.2, 0.2); beep(1047, 0.3, 'triangle', 0.22, 0.3); },
  hint() { beep(880, 0.1, 'sine', 0.13); beep(1100, 0.12, 'sine', 0.13, 0.08); },
  ui() { beep(700, 0.05, 'square', 0.06); }
};

// ============================================================
// GENERATORE (muri sottrattivi, unicità per costruzione)
// ============================================================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function buildSnake(N) {
  const path = [];
  for (let r = 0; r < N; r++) {
    if (r % 2 === 0) for (let c = 0; c < N; c++) path.push(r * N + c);
    else for (let c = N - 1; c >= 0; c--) path.push(r * N + c);
  }
  return path;
}
function gridNeighbors(N, cell) {
  const r = (cell / N) | 0, c = cell % N; const out = [];
  if (r > 0) out.push(cell - N);
  if (r < N - 1) out.push(cell + N);
  if (c > 0) out.push(cell - 1);
  if (c < N - 1) out.push(cell + 1);
  return out;
}
function backbite(N, path, iters, rnd) {
  const total = N * N; const pos = new Int32Array(total);
  for (let i = 0; i < total; i++) pos[path[i]] = i;
  function reverse(a, b) { while (a < b) { const t = path[a]; path[a] = path[b]; path[b] = t; pos[path[a]] = a; pos[path[b]] = b; a++; b--; } }
  for (let it = 0; it < iters; it++) {
    if (rnd() < 0.5) {
      const h = path[0]; const nb = gridNeighbors(N, h); const n = nb[(rnd() * nb.length) | 0];
      const i = pos[n]; if (i <= 1) continue; reverse(0, i - 1);
    } else {
      const t = path[total - 1]; const nb = gridNeighbors(N, t); const n = nb[(rnd() * nb.length) | 0];
      const i = pos[n]; if (i >= total - 2) continue; reverse(i + 1, total - 1);
    }
  }
  return path;
}
function buildAdj(N, openSet) {
  const total = N * N; const adj = [];
  for (let cell = 0; cell < total; cell++) {
    const list = [];
    for (const nb of gridNeighbors(N, cell)) {
      const a = Math.min(cell, nb), b = Math.max(cell, nb);
      if (openSet.has(a + '|' + b)) list.push(nb);
    }
    adj.push(list);
  }
  return adj;
}
function countSolutions(N, adj, startCell, endCell, numberOf, K, limit, budget) {
  const total = N * N; const visited = new Uint8Array(total);
  let count = 0, nodes = 0;
  function connectivityOK(cur) {
    let startFlood = -1;
    for (const nb of adj[cur]) if (!visited[nb]) { startFlood = nb; break; }
    let unvisitedCount = 0;
    for (let i = 0; i < total; i++) if (!visited[i]) unvisitedCount++;
    if (startFlood === -1) return unvisitedCount === 0;
    const stack = [startFlood]; const seen = new Uint8Array(total); seen[startFlood] = 1;
    let reached = 0, endReached = false;
    while (stack.length) {
      const x = stack.pop(); reached++;
      if (x === endCell) endReached = true;
      for (const nb of adj[x]) if (!visited[nb] && !seen[nb]) { seen[nb] = 1; stack.push(nb); }
    }
    if (reached !== unvisitedCount) return false;
    if (!endReached && cur !== endCell) return false;
    return true;
  }
  function dfs(cur, depth, nextNum) {
    if (count >= limit || nodes > budget) return;
    nodes++; visited[cur] = 1;
    if (depth === total - 1) { if (cur === endCell && nextNum > K) count++; visited[cur] = 0; return; }
    if (!connectivityOK(cur)) { visited[cur] = 0; return; }
    for (const nb of adj[cur]) {
      if (visited[nb]) continue;
      const num = numberOf[nb] || 0;
      if (num && num !== nextNum) continue;
      if (nb === endCell && depth + 1 !== total - 1) continue;
      dfs(nb, depth + 1, num ? nextNum + 1 : nextNum);
      if (count >= limit || nodes > budget) break;
    }
    visited[cur] = 0;
  }
  dfs(startCell, 0, 2);
  return { count, budgetExceeded: nodes > budget };
}
function generatePuzzle(cfg) {
  const N = cfg.N, total = N * N, budget = cfg.budget;
  const rnd = mulberry32((Math.random() * 2 ** 32) >>> 0);
  const P = buildSnake(N);
  backbite(N, P, 60 * total, rnd);

  const pathEdges = new Set();
  for (let i = 0; i + 1 < total; i++) { const a = Math.min(P[i], P[i + 1]), b = Math.max(P[i], P[i + 1]); pathEdges.add(a + '|' + b); }

  const K = cfg.checkpoints;
  const chkIdx = [0];
  for (let k = 1; k < K - 1; k++) chkIdx.push(Math.round(k * (total - 1) / (K - 1)));
  chkIdx.push(total - 1);
  const uniq = [...new Set(chkIdx)].sort((a, b) => a - b);
  const numberOf = new Int32Array(total);
  uniq.forEach((idx, i) => { numberOf[P[idx]] = i + 1; });
  const Kreal = uniq.length;

  const openSet = new Set(pathEdges);
  const candidates = [];
  for (let cell = 0; cell < total; cell++) {
    for (const nb of gridNeighbors(N, cell)) {
      if (nb < cell) continue;
      const key = cell + '|' + nb;
      if (!pathEdges.has(key)) candidates.push(key);
    }
  }
  for (let i = candidates.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [candidates[i], candidates[j]] = [candidates[j], candidates[i]]; }

  for (const key of candidates) {
    openSet.add(key);
    const adj = buildAdj(N, openSet);
    const res = countSolutions(N, adj, P[0], P[total - 1], numberOf, Kreal, 2, budget);
    if (res.budgetExceeded || res.count !== 1) openSet.delete(key);
  }

  const wallSet = new Set();
  for (let cell = 0; cell < total; cell++) {
    for (const nb of gridNeighbors(N, cell)) {
      if (nb < cell) continue;
      const key = cell + '|' + nb;
      if (!openSet.has(key)) wallSet.add(key);
    }
  }
  return { N, K: Kreal, wallSet, numberOf, solution: P.slice(), startCell: P[0], endCell: P[total - 1] };
}

// ============================================================
// DOM / BOARD
// ============================================================
const boardEl = document.getElementById('board');
const overlay = document.getElementById('overlay');
let cellEls = [];    // per indice cella
let boardPx = 300, cellPx = 50;

function edgeKey(a, b) { const x = Math.min(a, b), y = Math.max(a, b); return x + '|' + y; }
function isWall(a, b) { return state.puzzle.wallSet.has(edgeKey(a, b)); }
function areAdjacentOpen(a, b) {
  const N = state.N;
  const ra = (a / N) | 0, ca = a % N, rb = (b / N) | 0, cb = b % N;
  if (Math.abs(ra - rb) + Math.abs(ca - cb) !== 1) return false;
  return !isWall(a, b);
}

function buildBoardDom() {
  const N = state.N;
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${N}, 1fr)`;
  cellEls = new Array(N * N);
  for (let i = 0; i < N * N; i++) {
    const r = (i / N) | 0, c = i % N;
    const d = document.createElement('div');
    d.className = 'cell' + (c === N - 1 ? ' lastcol' : '') + (r === N - 1 ? ' lastrow' : '');
    const num = state.puzzle.numberOf[i];
    if (num) {
      const n = document.createElement('div');
      n.className = 'num' + (num === 1 ? ' start' : '');
      n.textContent = num;
      d.appendChild(n);
    }
    boardEl.appendChild(d);
    cellEls[i] = d;
  }
  // overlay SVG
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'overlay');
  svg.setAttribute('viewBox', `0 0 ${N} ${N}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = `<defs><linearGradient id="zipgrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c6ff3a"/><stop offset="1" stop-color="#00e5ff"/></linearGradient></defs>
    <g id="wallsG"></g><path id="pathP" class="pathline"/><circle id="headC" class="pathhead" r="0.13" style="display:none"/>`;
  boardEl.appendChild(svg);
  state._svg = svg;
  // muri
  const wg = svg.querySelector('#wallsG');
  let wl = '';
  for (const key of state.puzzle.wallSet) {
    const [a, b] = key.split('|').map(Number);
    const ra = (a / N) | 0, ca = a % N;
    if (b === a + 1) { // muro verticale a destra di a
      const x = ca + 1; wl += `<line class="wall" x1="${x}" y1="${ra}" x2="${x}" y2="${ra + 1}"/>`;
    } else { // b === a+N muro orizzontale sotto a
      const y = ra + 1; wl += `<line class="wall" x1="${ca}" y1="${y}" x2="${ca + 1}" y2="${y}"/>`;
    }
  }
  wg.innerHTML = wl;
  sizeBoard();
}

function sizeBoard() {
  const N = state.N;
  const availW = Math.min(window.innerWidth - 24, 460);
  const availH = window.innerHeight * (window.innerHeight <= 680 ? 0.62 : 0.56);
  boardPx = Math.max(180, Math.min(availW, availH, 460));
  cellPx = boardPx / N;
  boardEl.style.width = boardPx + 'px';
  boardEl.style.height = boardPx + 'px';
  // spessore linee in unità viewBox
  const pathW = 0.34, wallW = 0.12;
  const p = state._svg && state._svg.querySelector('#pathP');
  if (p) p.style.strokeWidth = pathW;
  if (state._svg) state._svg.querySelectorAll('.wall').forEach(w => { w.style.strokeWidth = wallW; });
}
window.addEventListener('resize', () => { if (state.puzzle) sizeBoard(); renderPath(); });

// ============================================================
// PERCORSO
// ============================================================
function nextExpected() {
  // numeri visitati sono 1..m in ordine → prossimo = m+1
  let m = 0;
  for (const cell of state.path) { const num = state.puzzle.numberOf[cell]; if (num) m = Math.max(m, num); }
  return m + 1;
}

function tryStep(cell) {
  const p = state.path;
  if (p.length === 0) return;
  const head = p[p.length - 1];
  if (cell === head) return;
  // retrazione: se è una cella già nel percorso, tronca fino a lì
  const idx = state.inPath[cell] ? p.indexOf(cell) : -1;
  if (idx >= 0 && idx < p.length - 1) {
    while (p.length - 1 > idx) { const rem = p.pop(); state.inPath[rem] = 0; }
    sfx.back();
    renderAll();
    return;
  }
  // estensione
  if (!areAdjacentOpen(head, cell)) return;
  if (state.inPath[cell]) return;
  const num = state.puzzle.numberOf[cell];
  if (num && num !== nextExpected()) return; // numeri solo in ordine
  p.push(cell); state.inPath[cell] = 1;
  if (num) sfx.check(); else sfx.step();
  renderAll();
  checkWin();
}

function renderAll() { renderCells(); renderPath(); updateHud(); }

function renderCells() {
  const N = state.N;
  for (let i = 0; i < N * N; i++) {
    cellEls[i].classList.toggle('filled', !!state.inPath[i]);
    const num = state.puzzle.numberOf[i];
    if (num) {
      const nEl = cellEls[i].querySelector('.num');
      if (nEl) nEl.classList.toggle('done', num < nextExpected());
    }
  }
}

function renderPath() {
  if (!state._svg) return;
  const pEl = state._svg.querySelector('#pathP');
  const head = state._svg.querySelector('#headC');
  if (state.path.length < 1) { pEl.setAttribute('d', ''); head.style.display = 'none'; return; }
  let d = '';
  state.path.forEach((cell, i) => {
    const r = (cell / state.N) | 0, c = cell % state.N;
    const x = c + 0.5, y = r + 0.5;
    d += (i === 0 ? 'M' : 'L') + x.toFixed(3) + ' ' + y.toFixed(3) + ' ';
  });
  pEl.setAttribute('d', d.trim());
  const hc = state.path[state.path.length - 1];
  const hr = (hc / state.N) | 0, hcx = hc % state.N;
  head.setAttribute('cx', hcx + 0.5); head.setAttribute('cy', hr + 0.5);
  head.style.display = state.path.length ? '' : 'none';
}

function updateHud() {
  document.getElementById('hudLevel').textContent = LEVELS[state.level] ? LEVELS[state.level].name : '—';
  document.getElementById('hudCells').textContent = state.path.length + '/' + (state.N * state.N);
  const best = bestTime(state.level);
  document.getElementById('hudBest').textContent = best !== null ? fmtTime(best) : '—';
  document.getElementById('hudTime').textContent = fmtTime(state.seconds);
}

function checkWin() {
  if (state.path.length !== state.N * state.N) return;
  if (nextExpected() <= state.puzzle.K) return; // non tutti i numeri
  // vittoria
  state.won = true;
  state.screen = 'over';
  clearInterval(state.timerId);
  sfx.win();
  const best = bestTime(state.level);
  const isRecord = best === null || state.seconds < best;
  saveScore({ level: state.level, seconds: state.seconds, date: new Date().toISOString().slice(0, 10) });
  // animazione: lampeggio percorso
  const pEl = state._svg.querySelector('#pathP');
  pEl.style.transition = 'stroke-width 0.3s';
  pEl.style.strokeWidth = 0.46;
  setTimeout(() => { if (pEl) pEl.style.strokeWidth = 0.34; }, 320);
  setTimeout(() => showResult(isRecord), 900);
}

// ============================================================
// INPUT (pointer su tutta la board)
// ============================================================
function cellFromPointer(clientX, clientY) {
  const rect = boardEl.getBoundingClientRect();
  const x = clientX - rect.left, y = clientY - rect.top;
  if (x < 0 || y < 0 || x >= rect.width || y >= rect.height) return -1;
  const c = Math.min(state.N - 1, Math.floor(x / (rect.width / state.N)));
  const r = Math.min(state.N - 1, Math.floor(y / (rect.height / state.N)));
  return r * state.N + c;
}
boardEl.addEventListener('pointerdown', (e) => {
  if (state.screen !== 'playing') return;
  ac();
  const cell = cellFromPointer(e.clientX, e.clientY);
  if (cell < 0) return;
  state.drawing = true;
  boardEl.setPointerCapture(e.pointerId);
  // se tocco una cella del percorso, tronca lì; altrimenti prova a estendere
  if (state.inPath[cell]) {
    const p = state.path, idx = p.indexOf(cell);
    if (idx >= 0 && idx < p.length - 1) { while (p.length - 1 > idx) { const rem = p.pop(); state.inPath[rem] = 0; } sfx.back(); renderAll(); }
  } else {
    tryStep(cell);
  }
  e.preventDefault();
});
boardEl.addEventListener('pointermove', (e) => {
  if (!state.drawing || state.screen !== 'playing') return;
  const cell = cellFromPointer(e.clientX, e.clientY);
  if (cell < 0) return;
  tryStep(cell);
  e.preventDefault();
});
function endDraw(e) { state.drawing = false; }
boardEl.addEventListener('pointerup', endDraw);
boardEl.addEventListener('pointercancel', endDraw);

// ============================================================
// PARTITA
// ============================================================
function startGame(level) {
  state.level = level;
  const cfg = LEVELS[level];
  state.N = cfg.N;
  // genera (può richiedere qualche decina di ms)
  state.puzzle = generatePuzzle(cfg);
  state.path = [state.puzzle.startCell];
  state.inPath = new Uint8Array(state.N * state.N);
  state.inPath[state.puzzle.startCell] = 1;
  state.won = false;
  state.seconds = 0;
  state.screen = 'playing';
  clearInterval(state.timerId);
  state.timerId = setInterval(() => { if (state.screen === 'playing') { state.seconds++; document.getElementById('hudTime').textContent = fmtTime(state.seconds); } }, 1000);
  hideOverlay();
  buildBoardDom();
  renderAll();
}

function doUndo() {
  if (state.screen !== 'playing' || state.path.length <= 1) return;
  const rem = state.path.pop(); state.inPath[rem] = 0;
  sfx.back(); renderAll();
}
function doClear() {
  if (state.screen !== 'playing') return;
  state.path = [state.puzzle.startCell];
  state.inPath = new Uint8Array(state.N * state.N);
  state.inPath[state.puzzle.startCell] = 1;
  sfx.ui(); renderAll();
}
function doHint() {
  if (state.screen !== 'playing') return;
  const sol = state.puzzle.solution;
  // trova il prefisso corretto più lungo
  let L = 0;
  while (L < state.path.length && L < sol.length && state.path[L] === sol[L]) L++;
  // ricostruisci fino a L+1
  state.path = sol.slice(0, Math.min(sol.length, L + 1));
  state.inPath = new Uint8Array(state.N * state.N);
  for (const c of state.path) state.inPath[c] = 1;
  sfx.hint(); renderAll(); checkWin();
}

// ============================================================
// OVERLAY / MENU
// ============================================================
function fmtTime(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function showOverlay(html) { overlay.innerHTML = '<div class="ov-content">' + html + '</div>'; overlay.classList.add('show'); }
function hideOverlay() { overlay.classList.remove('show'); }

function scoresHtml() {
  const scores = loadScores();
  const bests = {};
  for (const k of Object.keys(LEVELS)) { const t = bestTime(k); if (t !== null) bests[k] = t; }
  let rows = '';
  for (const k of Object.keys(LEVELS)) {
    if (bests[k] === undefined) continue;
    rows += '<div class="series-line">' + LEVELS[k].name + ': <strong style="color:#ffbe0b">' + fmtTime(bests[k]) + '</strong></div>';
  }
  return rows || '<div class="series-line">Nessun tempo registrato</div>';
}

function showMenu() {
  state.screen = 'menu';
  clearInterval(state.timerId);
  showOverlay(
    '<h2>ZIP</h2>' +
    '<div class="series-line">UN SOLO PERCORSO CHE COLLEGA I NUMERI IN ORDINE<br>E RIEMPIE TUTTA LA GRIGLIA</div>' +
    '<div class="mode-grid">' +
    '<button class="mode-card" data-lv="facile"><div class="mode-icon">🌱</div><div class="mode-name">FACILE</div><div class="mode-desc">Griglia 5×5</div></button>' +
    '<button class="mode-card" data-lv="medio"><div class="mode-icon">⚙️</div><div class="mode-name">MEDIO</div><div class="mode-desc">Griglia 6×6</div></button>' +
    '<button class="mode-card" data-lv="difficile"><div class="mode-icon">🔥</div><div class="mode-name">DIFFICILE</div><div class="mode-desc">Griglia 7×7</div></button>' +
    '<button class="mode-card" data-lv="esperto"><div class="mode-icon">💀</div><div class="mode-name">ESPERTO</div><div class="mode-desc">7×7, meno numeri</div></button>' +
    '</div>' +
    '<div class="series-line" style="margin-top:4px">MIGLIORI TEMPI</div>' + scoresHtml() +
    '<button class="ghost-btn" id="rulesBtn" style="margin-top:4px">REGOLE</button>'
  );
  overlay.querySelectorAll('.mode-card').forEach(btn => {
    btn.addEventListener('click', () => { sfx.ui(); showGenerating(); setTimeout(() => startGame(btn.dataset.lv), 30); });
  });
  overlay.querySelector('#rulesBtn').addEventListener('click', showHelp);
}

function showGenerating() {
  showOverlay('<h2>ZIP</h2><div class="series-line">GENERO IL PERCORSO…</div>');
}

function showHelp() {
  showOverlay(
    '<h2>REGOLE</h2>' +
    '<div class="help-list">' +
    '· Parti dalla cella <strong>1</strong> e traccia un unico percorso continuo fino all\'ultimo numero.<br>' +
    '· Devi toccare i numeri <strong>in ordine</strong>: 1, 2, 3, …<br>' +
    '· Il percorso si muove in orizzontale e verticale, <strong>non</strong> può incrociarsi né saltare celle.<br>' +
    '· Alla fine <strong>ogni</strong> cella deve far parte del percorso.<br>' +
    '· Le linee rosse sono <strong>muri</strong>: il percorso deve aggirarli.<br>' +
    '· Trascina il dito per disegnare; torna indietro per cancellare.' +
    '</div>' +
    '<button class="primary-btn" id="closeBtn">HO CAPITO</button>'
  );
  overlay.querySelector('#closeBtn').addEventListener('click', () => { if (state.screen === 'menu') showMenu(); else hideOverlay(); });
}

function showResult(isRecord) {
  showOverlay(
    '<div class="result-title">COMPLETATO!</div>' +
    '<div class="result-time">' + fmtTime(state.seconds) + '</div>' +
    (isRecord ? '<div class="new-record">★ NUOVO RECORD ★</div>' : '') +
    '<div class="series-line">LIVELLO ' + LEVELS[state.level].name + '</div>' +
    '<button class="primary-btn" id="againBtn">NUOVO PUZZLE</button>' +
    '<button class="ghost-btn" id="toMenuBtn">MENU</button>'
  );
  overlay.querySelector('#againBtn').addEventListener('click', () => { sfx.ui(); showGenerating(); setTimeout(() => startGame(state.level), 30); });
  overlay.querySelector('#toMenuBtn').addEventListener('click', () => { sfx.ui(); showMenu(); });
}

// ============================================================
// PULSANTI
// ============================================================
document.getElementById('undoBtn').addEventListener('click', doUndo);
document.getElementById('clearBtn').addEventListener('click', doClear);
document.getElementById('hintBtn').addEventListener('click', doHint);
document.getElementById('newBtn').addEventListener('click', () => { if (state.screen !== 'menu') { sfx.ui(); showGenerating(); setTimeout(() => startGame(state.level), 30); } });
document.getElementById('helpBtn').addEventListener('click', () => { sfx.ui(); showHelp(); });
document.getElementById('menuBtn').addEventListener('click', () => { sfx.ui(); showMenu(); });
function toggleSound() { soundOn = !soundOn; localStorage.setItem('zip-neon-sound', soundOn); document.getElementById('soundBtn').style.opacity = soundOn ? '1' : '0.4'; if (soundOn) sfx.ui(); }
document.getElementById('soundBtn').addEventListener('click', toggleSound);
document.getElementById('soundBtn').style.opacity = soundOn ? '1' : '0.4';

document.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') toggleSound();
  if (state.screen !== 'playing') return;
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { doUndo(); e.preventDefault(); }
  if (e.key === 'h' || e.key === 'H') doHint();
});

// ============================================================
// AVVIO
// ============================================================
showMenu();
</script>
</body>
</html>
