<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PAROLE — Neon Lettere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #030d09;
    --fg: #eafbf3;
    --muted: rgba(255,255,255,0.45);
    --accent: #06ffa5;      /* verde: lettera giusta */
    --accent2: #ffbe0b;     /* oro: lettera presente */
    --accent3: #00f5ff;
    --gold: #ffbe0b;
    --panel: rgba(8, 26, 18, 0.55);
    --border: rgba(255,255,255,0.08);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(6,255,165,0.08), transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(255,190,11,0.05), transparent 60%),
      linear-gradient(180deg, #030d09 0%, #06140e 50%, #05110c 100%);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 4px);
    pointer-events: none;
    z-index: 200;
    opacity: 0.22;
    mix-blend-mode: multiply;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    gap: 8px;
    max-width: 560px;
    margin: 0 auto;
  }

  header { text-align: center; line-height: 1; }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(18px, 4.5vw, 30px);
    letter-spacing: 10px;
    padding-left: 10px;
    background: linear-gradient(180deg, #ffffff 0%, #06ffa5 45%, #ffbe0b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(6,255,165,0.5));
    animation: titleGlow 4s ease-in-out infinite;
  }

  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(6,255,165,0.5)); }
    50% { filter: drop-shadow(0 0 26px rgba(255,190,11,0.6)); }
  }

  .subtitle { font-size: 9px; letter-spacing: 6px; color: rgba(255,255,255,0.35); font-weight: 700; margin-top: 4px; }

  .mode-tabs {
    display: flex;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }
  .mode-tab {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 6px 16px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-tab.active {
    background: linear-gradient(135deg, rgba(6,255,165,0.25), rgba(0,245,255,0.2));
    color: #fff;
    text-shadow: 0 0 8px rgba(6,255,165,0.6);
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .grid {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
  }

  .grid-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .grid-row.shake { animation: shakeRow 0.4s; }
  @keyframes shakeRow {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .tile {
    width: clamp(44px, 12.5vw, 60px);
    height: clamp(44px, 12.5vw, 60px);
    border: 2px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(18px, 5.5vw, 26px);
    color: #fff;
    transition: transform 0.08s;
  }
  .tile.typed { border-color: rgba(255,255,255,0.4); animation: popIn 0.12s; }
  @keyframes popIn { 0% { transform: scale(0.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

  .tile.flip { animation: flipTile 0.5s ease forwards; }
  @keyframes flipTile {
    0% { transform: rotateX(0); }
    49.9% { transform: rotateX(90deg); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }

  .tile.correct { background: rgba(6,255,165,0.22); border-color: var(--accent); color: var(--accent); text-shadow: 0 0 12px rgba(6,255,165,0.8); box-shadow: 0 0 14px rgba(6,255,165,0.25); }
  .tile.present { background: rgba(255,190,11,0.18); border-color: var(--accent2); color: var(--accent2); text-shadow: 0 0 12px rgba(255,190,11,0.8); box-shadow: 0 0 14px rgba(255,190,11,0.2); }
  .tile.absent { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.07); color: rgba(255,255,255,0.28); }

  .tile.winpulse { animation: winPulse 0.6s ease-in-out 2; }
  @keyframes winPulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .toast {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%) translateY(-100%);
    background: rgba(8, 26, 18, 0.95);
    border: 1px solid rgba(6,255,165,0.4);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 8px 16px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 60;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: center;
    width: 100%;
    max-width: 480px;
  }

  .kb-row { display: flex; gap: 4px; justify-content: center; width: 100%; }

  .key {
    flex: 1 1 0;
    max-width: 42px;
    height: 46px;
    border-radius: 7px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    padding: 0;
  }
  .key.wide { max-width: 64px; flex: 1.6 1 0; font-size: 9px; letter-spacing: 1px; }
  .key:hover { background: rgba(255,255,255,0.14); }
  .key.correct { background: rgba(6,255,165,0.25); border-color: rgba(6,255,165,0.6); color: var(--accent); }
  .key.present { background: rgba(255,190,11,0.2); border-color: rgba(255,190,11,0.55); color: var(--accent2); }
  .key.absent { background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.05); color: rgba(255,255,255,0.25); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 13, 9, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
  }

  .overlay.show { opacity: 1; pointer-events: all; }

  .overlay-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px;
    max-width: 94%;
    max-height: 94%;
    overflow-y: auto;
    text-align: center;
    background: rgba(8, 26, 18, 0.7);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .overlay-content h2 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 5px;
    background: linear-gradient(180deg, #fff, #06ffa5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .result-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
  }
  .result-title.win { color: var(--accent); text-shadow: 0 0 22px rgba(6,255,165,0.7); }
  .result-title.lose { color: #ff2a78; text-shadow: 0 0 22px rgba(255,42,120,0.7); }

  .word-reveal {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255,190,11,0.6);
  }

  .series-line { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.5); font-weight: 700; line-height: 1.7; }

  .stat-cards { display: flex; gap: 10px; }
  .stat-card { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 58px; }
  .stat-card .num { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900; color: #fff; }
  .stat-card .lbl { font-size: 7.5px; letter-spacing: 1px; color: var(--muted); font-weight: 700; }

  .dist-panel { width: 260px; max-width: 80vw; display: flex; flex-direction: column; gap: 4px; }
  .dist-row { display: flex; align-items: center; gap: 6px; }
  .dist-row .n { font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; color: var(--muted); width: 12px; }
  .dist-bar {
    height: 16px;
    background: rgba(6,255,165,0.3);
    border: 1px solid rgba(6,255,165,0.5);
    border-radius: 4px;
    min-width: 18px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 6px;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
  }
  .dist-bar.hl { background: rgba(255,190,11,0.4); border-color: var(--gold); }

  .primary-btn, .ghost-btn {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 11px 30px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .primary-btn {
    background: linear-gradient(135deg, #06ffa5, #00b8ff);
    color: #04120c;
    border: none;
    box-shadow: 0 4px 22px rgba(6,255,165,0.4);
  }
  .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(6,255,165,0.6); }

  .ghost-btn { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.15); }
  .ghost-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

  .countdown-line { font-size: 9px; letter-spacing: 2px; color: var(--muted); font-weight: 700; }
  .countdown-line strong { font-family: 'Orbitron', sans-serif; color: var(--accent3); font-size: 12px; }

  .help-grid { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .help-row { display: flex; align-items: center; gap: 8px; font-size: 9.5px; color: rgba(255,255,255,0.65); line-height: 1.5; }
  .mini-tile {
    width: 26px; height: 26px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 13px;
    flex: 0 0 auto;
  }
  .mini-tile.c { background: rgba(6,255,165,0.22); border: 1px solid var(--accent); color: var(--accent); }
  .mini-tile.p { background: rgba(255,190,11,0.18); border: 1px solid var(--accent2); color: var(--accent2); }
  .mini-tile.a { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.35); }

  .icon-btns { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 90; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(8,26,18,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: #fff; border-color: var(--accent); box-shadow: 0 0 10px rgba(6,255,165,0.3); }

  @media (max-height: 640px) {
    header { display: none; }
    .app { gap: 5px; }
    .tile { width: clamp(38px, 10.5vw, 50px); height: clamp(38px, 10.5vw, 50px); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="title">PAROLE</h1>
    <div class="subtitle">NEON LETTERE</div>
  </header>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tabDaily">DEL GIORNO</button>
    <button class="mode-tab" id="tabFree">LIBERA</button>
  </div>

  <div class="stage">
    <div class="toast" id="toast"></div>
    <div class="grid" id="grid"></div>
    <div class="keyboard" id="keyboard"></div>
  </div>

  <div class="icon-btns">
    <button class="icon-btn" id="helpBtn" aria-label="Aiuto">?</button>
    <button class="icon-btn" id="statsBtn" aria-label="Statistiche">📊</button>
    <button class="icon-btn" id="soundBtn" aria-label="Audio">♪</button>
  </div>

  <div class="overlay" id="overlay"></div>
</div>

<script>
'use strict';

// ============================================================
// DIZIONARIO — soluzioni (parole comuni, senza accenti)
// ============================================================
const SOLUTIONS = (
  'ABETE ACERO ACIDO ACUTO ADDIO AEREO AFOSO AGILE AGIRE AGLIO AIUTO ALATO ALBUM ALIBI ALTRO AMACA AMARE AMARO AMICO AMORE ' +
  'ANIMA ANSIA ANTRO APICE ARARE ARENA ARIDO AROMA ASILO ASINO ASTRO ATOMO ATRIO AUDIO AVARO AVENA AVERE AVIDO AZOTO ' +
  'BACIO BAFFO BAGNO BALIA BALLO BALZO BANCA BANCO BANDA BARBA BARCA BASSO BAULE BEATO BECCO BEFFA BELLO BENDA BIRRA BISCA ' +
  'BOCCA BOLLA BORGO BORSA BOSCO BOTTE BOTTO BRACE BRAVO BREVE BRINA BRODO BRUCO BRUNO BUFFO BUGIA BUONO BURRO BUSTA BUSTO ' +
  'CACAO CALCE CALDO CALMA CAMPO CANNA CANTO CAPRA CARNE CARTA CASSA CASTA CAUSA CAUTO CEDRO CELLA CENTO CERTO CESTO CHILO ' +
  'CIECO CIFRA CIGNO CINTA CIRCO CLIMA COLLE COLLO COLMO COLPA COLPO COLTO CONTE CONTO COPPA CORDA CORNO CORPO CORSA CORSO ' +
  'CORTE CORTO CORVO COSTA COZZA CREDO CREMA CRETA CROCE CRUDO CULTO CUOCO CUORE CURVA ' +
  'DANNO DANZA DARDO DELTA DENSO DENTE DESTO DIECI DIETA DISCO DOLCE DONNA DORSO DRAGO DUOMO ' +
  'EBANO ELICA EPOCA EREDE ESAME ESITO ETICA ' +
  'FALCO FALDA FALSO FANGO FARRO FATTO FELCE FERMO FERRO FESTA FETTA FIABA FIENO FIERA FINTO FIORE FIRMA FISCO FIUME FOLLA ' +
  'FONDO FONTE FORMA FORNO FORTE FORZA FOSSA FRANA FRASE FRATE FRENO FRODE FUNGO FUOCO FURBO FURIA FURTO ' +
  'GALLO GAMBA GATTO GAZZA GEMMA GENIO GENTE GESSO GESTO GHIRO GIOCO GIOIA GLOBO GNOMO GOLFO GOMMA GONNA GRADO GRANO GRATO ' +
  'GRAVE GRECO GRIDO GUAIO GUIDA GUSTO ' +
  'IGLOO ISOLA ' +
  'LADRO LAMPO LARDO LARGO LATTE LEGGE LEGNO LENTE LENTO LEONE LEPRE LETTO LIBRO LIETO LIEVE LISTA LITRO LOTTA LUNGO LUOGO LUSSO ' +
  'MADRE MAGIA MAGRO MAMMA MANGO MANZO MAPPA MARMO MARZO MASSA MATTO MEDIA MENTA MERCE MERLO MESSA METRO MEZZO MIELE MILLE ' +
  'MILZA MIRTO MISTO MOLLA MONDO MONTE MORBO MORSO MORTE MOSCA MOSTO MOTTO MUCCA MUSEO ' +
  'NAFTA NANNA NERVO NONNA NONNO NORMA NOTTE NOZZE NUORA NUOVO NUOTO ' +
  'ODORE OLIVA OLIVO OMBRA ONORE OPERA OSARE OVEST ' +
  'PACCO PADRE PAESE PALCO PALMA PANCA PANNA PANNO PARCO PARTE PASSO PASTA PASTO PATTO PAURA PAUSA PAZZO PELLE PENNA PERLA ' +
  'PESCA PESCE PESTO PETTO PEZZO PIANO PICCO PIEDE PIENO PIGRO PINZA PIUMA PIZZA POEMA POETA POLLO POLPO POLSO POMPA PONTE ' +
  'PORRE PORRO PORTA PORTO POSTA POSTO POZZO PRATO PREDA PREGO PRESA PRETE PRIMO PROSA PROVA PUGNO PULCE PUNTA PUNTO ' +
  'QUOTA ' +
  'RADIO RAGNO RAZZO REATO REGNO RENNA RESTO RICCO RITMO ROCCA ROMBO ROSPO ROSSO RUOTA ' +
  'SACCO SALDO SALSA SALTO SANTO SARTO SASSO SAZIO SCALA SCENA SCOPO SCUDO SCURO SECCO SEDIA SEGNO SELLA SELVA SENNO SENSO ' +
  'SERIO SERPE SERRA SERVO SESTO SETTE SFIDA SFERA SIEPE SIGLA SISMA SOGNO SOLCO SOLDO SONNO SORDO SORTE SOSTA SPADA SPAGO ' +
  'SPESA SPINA SPORT SPOSA SPOSO STATO STILE STIMA SUCCO SUONO SUORA SVAGO ' +
  'TACCO TALPA TAPPA TAPPO TARGA TARLO TASCA TASSA TASTO TAZZA TEMPO TENDA TERME TERRA TERZO TESTA TESTO TETTO TIGRE TINTA ' +
  'TONDO TONFO TONNO TORRE TORTA TOSSE TRAMA TRAVE TRENO TRONO TROTA TUONO TURNO ' +
  'UDIRE UMIDO UNIRE USARE USATO UTILE ' +
  'VALLE VANGA VASCA VENTO VERBO VERDE VERME VERSO VESPA VESTE VETRO VETTA VIALE VIDEO VIGNA VILLA VIOLA VIRUS VISTA VOLTO ' +
  'VOLPE VOLTA VUOTO ' +
  'ZAINO ZEBRA ZINCO ZITTO ZUCCA ZUPPA'
).split(' ');

// Parole valide come tentativo ma non estratte come soluzione
const EXTRA = (
  'PARLA PARLO CORRE CORRO DORME DORMO DORMI CANTA CANTI SENTE SENTO VIENE VIENI VANNO PENSA PENSO CREDE CREDI TROVA TROVO ' +
  'METTE METTO VUOLE SANNO FANNO DISSE VINCE VINCI PERDE PERDI PERSO VINTO DETTO VISTO PRESO MESSO ROTTO MORTO AVUTO GIOCA ' +
  'BALLA NUOTA SALTA SALTI SEGUE SEGUO AMANO AMATO AMICA ANICE ARNIA AMBRA ALGHE ACARO AGAVE BACCA BIVIO BOMBA BORDO BOZZA ' +
  'BRUMA CALLO CALZA CANOA CAPPA CARIE CARRO CESTA CETRA CIRCA COBRA COLLA CONCA COPIA COSMO CRINE CULLA DAINO DOGMA DOSSO ' +
  'DOTTO EDERA EPICA ERICA ESODO ETERE ETNIA FARSA FEUDO FIALA FIBRA FLORA FOSSO FUSTO GARZA GERGO GERLA GIADA GIARA GOBBA ' +
  'GORGO GRUMO GUADO IDOLO IRIDE ISTMO LACCA LARVA LENZA LESSO LIANA LILLA LIMBO LINFA LOTTO LUCRO MADIA MAGMA MALGA MALTA ' +
  'MANIA MANNA MANTO MAREA MENTE MERLA MESSE MOSSA MUFFA NARDO NINFA NOCCA OBLIO ORAFO ORCIO PIAGA PIEGA PINTA RETTA RIBES ' +
  'RICCA RISMA RONDA RUSPA SAGRA SALMA SCADE SCAVO SCESA SCOLO SESTA SOMMA SONDA SOTTO SOPRA SPORA STELO STESO STIVA STOLA ' +
  'STUFA TARMA TIARA TINCA TORBA TUFFO TURBA UGOLA URINA VAMPA VASTO VERGA VOLGO ZOLLA ZOLFO ZUFFA ' +
  'QUALE TANTO TUTTO NULLA MOLTO FORSE QUASI FUORI PRIMA TARDI'
).split(' ');

// Espansione automatica di plurali regolari: -O→-I, -A→-E, -E→-I
// (esclusi i casi in cui il plurale cambia lunghezza: -CO/-GO/-IO, -CA/-GA)
function expandForms(words) {
  const out = new Set(words);
  for (const w of words) {
    const stem = w.slice(0, -1);
    if (w.endsWith('O') && !w.endsWith('CO') && !w.endsWith('GO') && !w.endsWith('IO')) out.add(stem + 'I');
    if (w.endsWith('A') && !w.endsWith('CA') && !w.endsWith('GA')) out.add(stem + 'E');
    if (w.endsWith('E')) out.add(stem + 'I');
  }
  return out;
}
const VALID = expandForms(SOLUTIONS.concat(EXTRA));

// ============================================================
// COSTANTI
// ============================================================
const ROWS = 6, COLS = 5;
const DAILY_KEY = 'parole-neon-daily';
const STATS_KEY = 'parole-neon-stats';
const FREE_KEY = 'parole-neon-free';
const EPOCH = new Date(2026, 0, 1); // Parole #1 = 1 gennaio 2026
const KB_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', '\nZXCVBNM\b'];

// ============================================================
// STATO
// ============================================================
const state = {
  mode: 'daily',            // daily | free
  target: '',
  guesses: [],              // parole confermate
  current: '',              // tentativo in corso
  done: false,
  win: false,
  lock: false,
  dayNum: 0
};

let soundOn = localStorage.getItem('parole-neon-sound') !== 'false';

// ============================================================
// GIORNO E PAROLA DEL GIORNO
// ============================================================
function todayNumber() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((today - EPOCH) / 86400000);
}

function dailyWord(n) {
  // Permutazione deterministica: stesso giorno = stessa parola per tutti
  let idx = ((n * 40503 + 12289) >>> 0) % SOLUTIONS.length;
  return SOLUTIONS[idx];
}

function msToMidnight() {
  const now = new Date();
  const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  return mid - now;
}

// ============================================================
// PERSISTENZA
// ============================================================
function loadJson(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v === null || v === undefined ? fallback : v; }
  catch (e) { return fallback; }
}
function saveJson(key, v) {
  try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
}

function loadStats() {
  return loadJson(STATS_KEY, { played: 0, wins: 0, streak: 0, maxStreak: 0, dist: [0,0,0,0,0,0], lastWinDay: -2 });
}

function saveDaily() {
  if (state.mode !== 'daily') return;
  saveJson(DAILY_KEY, { day: state.dayNum, guesses: state.guesses, done: state.done, win: state.win });
}

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, type, vol, delay) {
  if (!soundOn) return;
  try {
    const ctx = ac();
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  type() { beep(500, 0.03, 'square', 0.05); },
  flip() { beep(400, 0.05, 'triangle', 0.08); },
  invalid() { beep(190, 0.15, 'sawtooth', 0.1); },
  win() { beep(523, 0.12, 'triangle', 0.2); beep(659, 0.12, 'triangle', 0.2, 0.1); beep(784, 0.12, 'triangle', 0.2, 0.2); beep(1047, 0.25, 'triangle', 0.22, 0.3); },
  lose() { beep(330, 0.16, 'sawtooth', 0.12); beep(247, 0.16, 'sawtooth', 0.12, 0.14); beep(196, 0.3, 'sawtooth', 0.14, 0.28); },
  ui() { beep(700, 0.05, 'square', 0.06); }
};

// ============================================================
// DOM
// ============================================================
const gridEl = document.getElementById('grid');
const keyboardEl = document.getElementById('keyboard');
const overlay = document.getElementById('overlay');
const toast = document.getElementById('toast');
const keyEls = {};
const tileEls = []; // [row][col]

for (let r = 0; r < ROWS; r++) {
  const row = document.createElement('div');
  row.className = 'grid-row';
  const tiles = [];
  for (let c = 0; c < COLS; c++) {
    const t = document.createElement('div');
    t.className = 'tile';
    row.appendChild(t);
    tiles.push(t);
  }
  gridEl.appendChild(row);
  tileEls.push(tiles);
}

for (const rowSpec of KB_ROWS) {
  const div = document.createElement('div');
  div.className = 'kb-row';
  for (const ch of rowSpec) {
    const b = document.createElement('button');
    if (ch === '\n') { b.className = 'key wide'; b.textContent = 'INVIO'; b.dataset.k = 'Enter'; }
    else if (ch === '\b') { b.className = 'key wide'; b.textContent = '⌫'; b.dataset.k = 'Backspace'; }
    else { b.className = 'key'; b.textContent = ch; b.dataset.k = ch; keyEls[ch] = b; }
    b.addEventListener('click', () => handleKey(b.dataset.k));
    div.appendChild(b);
  }
  keyboardEl.appendChild(div);
}

// ============================================================
// VALUTAZIONE (gestione corretta delle lettere doppie)
// ============================================================
function evaluate(guess, target) {
  const res = Array(COLS).fill('absent');
  const t = target.split('');
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === t[i]) { res[i] = 'correct'; t[i] = null; }
  }
  for (let i = 0; i < COLS; i++) {
    if (res[i] === 'correct') continue;
    const j = t.indexOf(guess[i]);
    if (j >= 0) { res[i] = 'present'; t[j] = null; }
  }
  return res;
}

// ============================================================
// AVVIO PARTITA
// ============================================================
function initMode(mode) {
  state.mode = mode;
  state.current = '';
  state.lock = false;
  document.getElementById('tabDaily').classList.toggle('active', mode === 'daily');
  document.getElementById('tabFree').classList.toggle('active', mode === 'free');

  if (mode === 'daily') {
    state.dayNum = todayNumber();
    state.target = dailyWord(state.dayNum);
    const saved = loadJson(DAILY_KEY, null);
    if (saved && saved.day === state.dayNum) {
      state.guesses = saved.guesses || [];
      state.done = !!saved.done;
      state.win = !!saved.win;
    } else {
      state.guesses = [];
      state.done = false;
      state.win = false;
      saveDaily();
    }
  } else {
    state.target = SOLUTIONS[Math.floor(Math.random() * SOLUTIONS.length)];
    state.guesses = [];
    state.done = false;
    state.win = false;
  }
  renderAll();
  if (state.mode === 'daily' && state.done) setTimeout(() => showResult(false), 400);
}

// ============================================================
// INPUT
// ============================================================
function handleKey(k) {
  if (state.lock || state.done) return;
  if (k === 'Enter') { submit(); return; }
  if (k === 'Backspace') {
    if (state.current.length > 0) {
      state.current = state.current.slice(0, -1);
      renderCurrentRow();
    }
    return;
  }
  if (/^[A-Z]$/.test(k) && state.current.length < COLS) {
    state.current += k;
    sfx.type();
    renderCurrentRow();
  }
}

function submit() {
  if (state.current.length < COLS) { showToast('LETTERE INSUFFICIENTI'); shakeRow(); return; }
  if (!VALID.has(state.current)) { showToast('PAROLA NON VALIDA'); shakeRow(); sfx.invalid(); return; }

  const guess = state.current;
  const row = state.guesses.length;
  state.guesses.push(guess);
  state.current = '';
  state.lock = true;

  const res = evaluate(guess, state.target);
  for (let i = 0; i < COLS; i++) {
    const tile = tileEls[row][i];
    setTimeout(() => {
      tile.classList.add('flip');
      sfx.flip();
      setTimeout(() => {
        tile.classList.add(res[i]);
        updateKeyColor(guess[i], res[i]);
      }, 250);
    }, i * 260);
  }

  setTimeout(() => {
    state.lock = false;
    const won = guess === state.target;
    if (won || state.guesses.length >= ROWS) {
      state.done = true;
      state.win = won;
      if (state.mode === 'daily') {
        const stats = loadStats();
        stats.played += 1;
        if (won) {
          stats.wins += 1;
          stats.dist[state.guesses.length - 1] += 1;
          stats.streak = (stats.lastWinDay === state.dayNum - 1) ? stats.streak + 1 : 1;
          stats.lastWinDay = state.dayNum;
          if (stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;
        } else {
          stats.streak = 0;
        }
        saveJson(STATS_KEY, stats);
        saveDaily();
      } else {
        const f = loadJson(FREE_KEY, { win: 0, lose: 0 });
        if (won) f.win += 1; else f.lose += 1;
        saveJson(FREE_KEY, f);
      }
      if (won) {
        sfx.win();
        for (let i = 0; i < COLS; i++) {
          setTimeout(() => tileEls[row][i].classList.add('winpulse'), i * 90);
        }
      } else {
        sfx.lose();
      }
      setTimeout(() => showResult(true), won ? 1100 : 600);
    } else if (state.mode === 'daily') {
      saveDaily();
    }
  }, COLS * 260 + 300);
}

function shakeRow() {
  const row = gridEl.children[state.guesses.length];
  if (!row) return;
  row.classList.add('shake');
  setTimeout(() => row.classList.remove('shake'), 450);
}

let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

// ============================================================
// RENDER
// ============================================================
function renderAll() {
  for (const ch in keyEls) keyEls[ch].className = 'key';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = tileEls[r][c];
      t.className = 'tile';
      t.textContent = '';
    }
  }
  for (let r = 0; r < state.guesses.length; r++) {
    const guess = state.guesses[r];
    const res = evaluate(guess, state.target);
    for (let c = 0; c < COLS; c++) {
      const t = tileEls[r][c];
      t.textContent = guess[c];
      t.classList.add(res[c]);
      updateKeyColor(guess[c], res[c]);
    }
  }
  renderCurrentRow();
}

function renderCurrentRow() {
  const r = state.guesses.length;
  if (r >= ROWS) return;
  for (let c = 0; c < COLS; c++) {
    const t = tileEls[r][c];
    t.className = 'tile' + (c < state.current.length ? ' typed' : '');
    t.textContent = state.current[c] || '';
  }
}

const KEY_RANK = { absent: 0, present: 1, correct: 2 };
function updateKeyColor(ch, res) {
  const el = keyEls[ch];
  if (!el) return;
  const cur = el.dataset.state;
  if (!cur || KEY_RANK[res] > KEY_RANK[cur]) {
    el.dataset.state = res;
    el.className = 'key ' + res;
  }
}

// ============================================================
// OVERLAY: risultato, statistiche, aiuto
// ============================================================
function showOverlay(html) {
  overlay.innerHTML = '<div class="overlay-content">' + html + '</div>';
  overlay.classList.add('show');
  overlay.addEventListener('click', (e) => { if (e.target === overlay) hideOverlay(); });
}
function hideOverlay() { overlay.classList.remove('show'); }

function emojiGrid() {
  const map = { correct: '🟩', present: '🟨', absent: '⬛' };
  return state.guesses.map(g => evaluate(g, state.target).map(r => map[r]).join('')).join('\n');
}

function fmtCountdown(ms) {
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

let countdownTimer = null;
function showResult(fresh) {
  const stats = loadStats();
  const pct = stats.played ? Math.round(stats.wins / stats.played * 100) : 0;
  let html = '<div class="result-title ' + (state.win ? 'win' : 'lose') + '">' +
    (state.win ? ['GENIO!', 'FANTASTICO!', 'OTTIMO!', 'BRAVO!', 'BENE!', 'PER UN PELO!'][state.guesses.length - 1] : 'PECCATO') + '</div>' +
    '<div class="word-reveal">' + state.target + '</div>';

  if (state.mode === 'daily') {
    html += '<div class="stat-cards">' +
      '<div class="stat-card"><div class="num">' + stats.played + '</div><div class="lbl">GIOCATE</div></div>' +
      '<div class="stat-card"><div class="num">' + pct + '%</div><div class="lbl">VITTORIE</div></div>' +
      '<div class="stat-card"><div class="num">' + stats.streak + '</div><div class="lbl">SERIE</div></div>' +
      '<div class="stat-card"><div class="num">' + stats.maxStreak + '</div><div class="lbl">RECORD</div></div>' +
      '</div>' +
      distHtml(stats) +
      '<div class="countdown-line">PROSSIMA PAROLA TRA <strong id="cd"></strong></div>' +
      '<button class="primary-btn" id="shareBtn">CONDIVIDI</button>' +
      '<button class="ghost-btn" id="freeBtn">GIOCA IN MODALITÀ LIBERA</button>';
  } else {
    const f = loadJson(FREE_KEY, { win: 0, lose: 0 });
    html += '<div class="series-line">MODALITÀ LIBERA — VINTE: ' + f.win + ' · PERSE: ' + f.lose + '</div>' +
      '<button class="primary-btn" id="againBtn">ALTRA PAROLA</button>';
  }
  showOverlay(html);

  if (state.mode === 'daily') {
    const cd = overlay.querySelector('#cd');
    const tick = () => { if (cd.isConnected) cd.textContent = fmtCountdown(msToMidnight()); };
    tick();
    clearInterval(countdownTimer);
    countdownTimer = setInterval(tick, 1000);
    overlay.querySelector('#shareBtn').addEventListener('click', () => {
      const txt = 'PAROLE TNT #' + state.dayNum + ' ' + (state.win ? state.guesses.length : 'X') + '/6\n\n' + emojiGrid();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => showToast('COPIATO NEGLI APPUNTI'), () => showToast('COPIA NON RIUSCITA'));
      } else showToast('COPIA NON DISPONIBILE');
    });
    overlay.querySelector('#freeBtn').addEventListener('click', () => { sfx.ui(); hideOverlay(); initMode('free'); });
  } else {
    overlay.querySelector('#againBtn').addEventListener('click', () => { sfx.ui(); hideOverlay(); initMode('free'); });
  }
}

function distHtml(stats) {
  const max = Math.max(1, ...stats.dist);
  let rows = '';
  for (let i = 0; i < 6; i++) {
    const w = Math.round(stats.dist[i] / max * 100);
    const hl = state.win && state.guesses.length === i + 1 ? ' hl' : '';
    rows += '<div class="dist-row"><span class="n">' + (i + 1) + '</span>' +
      '<div class="dist-bar' + hl + '" style="width:' + Math.max(10, w) + '%">' + stats.dist[i] + '</div></div>';
  }
  return '<div class="dist-panel">' + rows + '</div>';
}

function showStats() {
  const stats = loadStats();
  const pct = stats.played ? Math.round(stats.wins / stats.played * 100) : 0;
  showOverlay(
    '<h2>STATISTICHE</h2>' +
    '<div class="stat-cards">' +
    '<div class="stat-card"><div class="num">' + stats.played + '</div><div class="lbl">GIOCATE</div></div>' +
    '<div class="stat-card"><div class="num">' + pct + '%</div><div class="lbl">VITTORIE</div></div>' +
    '<div class="stat-card"><div class="num">' + stats.streak + '</div><div class="lbl">SERIE</div></div>' +
    '<div class="stat-card"><div class="num">' + stats.maxStreak + '</div><div class="lbl">RECORD</div></div>' +
    '</div>' +
    distHtml(stats) +
    '<button class="ghost-btn" id="closeBtn">CHIUDI</button>'
  );
  overlay.querySelector('#closeBtn').addEventListener('click', hideOverlay);
}

function showHelp() {
  showOverlay(
    '<h2>COME SI GIOCA</h2>' +
    '<div class="series-line">INDOVINA LA PAROLA ITALIANA DI 5 LETTERE IN 6 TENTATIVI.<br>OGNI GIORNO UNA NUOVA PAROLA PER TUTTI.</div>' +
    '<div class="help-grid">' +
    '<div class="help-row"><span class="mini-tile c">T</span> La lettera è nella parola, al posto giusto</div>' +
    '<div class="help-row"><span class="mini-tile p">N</span> La lettera è nella parola, ma in un\'altra posizione</div>' +
    '<div class="help-row"><span class="mini-tile a">Z</span> La lettera non è nella parola</div>' +
    '</div>' +
    '<div class="series-line">NIENTE ACCENTI: CITTÀ SI SCRIVE CITTA.<br>IN MODALITÀ LIBERA GIOCHI QUANTE PAROLE VUOI.</div>' +
    '<button class="primary-btn" id="closeBtn">GIOCA</button>'
  );
  overlay.querySelector('#closeBtn').addEventListener('click', hideOverlay);
}

// ============================================================
// EVENTI GLOBALI
// ============================================================
document.addEventListener('keydown', (e) => {
  if (overlay.classList.contains('show')) {
    if (e.key === 'Escape' || e.key === 'Enter') hideOverlay();
    return;
  }
  if (e.key === 'Enter') { handleKey('Enter'); return; }
  if (e.key === 'Backspace') { handleKey('Backspace'); return; }
  const ch = e.key.toUpperCase();
  if (/^[A-Z]$/.test(ch) && !e.ctrlKey && !e.altKey && !e.metaKey) handleKey(ch);
});

document.getElementById('tabDaily').addEventListener('click', () => { sfx.ui(); initMode('daily'); });
document.getElementById('tabFree').addEventListener('click', () => { sfx.ui(); initMode('free'); });
document.getElementById('statsBtn').addEventListener('click', () => { sfx.ui(); showStats(); });
document.getElementById('helpBtn').addEventListener('click', () => { sfx.ui(); showHelp(); });

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('parole-neon-sound', soundOn);
  document.getElementById('soundBtn').style.opacity = soundOn ? '1' : '0.4';
  if (soundOn) sfx.ui();
}
document.getElementById('soundBtn').addEventListener('click', toggleSound);
document.getElementById('soundBtn').style.opacity = soundOn ? '1' : '0.4';

// ============================================================
// AVVIO
// ============================================================
initMode('daily');
if (loadStats().played === 0 && state.guesses.length === 0) showHelp();
</script>
