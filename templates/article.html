<a class="back-link" href="../../index.html">&larr; Tutte le notizie</a>

<article class="article">
  <header class="article-header">
    {{TAGS}}
    <h1>{{TITLE}}</h1>
    <p class="article-summary">{{SUMMARY}}</p>
    <p class="article-meta">
      <time datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time> &middot; {{AUTHOR}}
    </p>
  </header>

  <div class="article-body">
    {{BODY}}
  </div>

  {{SOURCES}}
</article>
